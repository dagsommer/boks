# Verifies that the imago in effect maps a nerdbox-shaped packed disk correctly.
#
# The dependency is the ordinary crates.io one, so this fails against a stock imago and passes
# against a patched one. Whichever imago the build has arranged -- via [patch.crates-io] or a
# future upstream release -- is the one this tests.
[package]
name = "imago-vmdk-verify"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
imago = { version = "0.2.3", features = ["sync-wrappers"] }

[[bin]]
name = "imago-vmdk-verify"
path = "src/main.rs"
