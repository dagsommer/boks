# Verifies that the imago in effect maps a nerdbox-shaped packed disk correctly.
#
# 0.2.4 is the first release with the extent-boundary fix. The requirement is written as the
# ordinary caret one, so this tracks whatever libkrun ends up resolving; point it at "=0.2.3"
# to watch it fail, which is the only way to know it can.
[package]
name = "imago-vmdk-verify"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
imago = { version = "0.2.4", features = ["sync-wrappers"] }

[[bin]]
name = "imago-vmdk-verify"
path = "src/main.rs"
