# Build and publish the Boks agent images to ghcr.io/dagsommer/boks/*.
#
# The shape of this workflow is a security decision, not an accident of convenience. Read
# the comment on the `push` job before simplifying it into a single `docker buildx
# --push`, which is what it will look like it wants to be.
name: images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to GHCR (otherwise build only)"
        type: boolean
        default: false

env:
  IMAGE_REPO: ghcr.io/dagsommer/boks

# Nothing at the top level gets more than read. Each job asks for what it needs.
permissions:
  contents: read

jobs:
  # Resolve the tag once, from internal/agent, so the images and the registry that resolves
  # an agent to an image can never disagree about what version means.
  tag:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      images: ${{ steps.resolve.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: |
          set -euo pipefail
          # Reads ImageTag, and fails when a release tag disagrees with it. The same script
          # gates .github/workflows/release.yml, so the images and the binaries published
          # for one tag cannot be built against two different opinions of the version.
          image_tag="$(scripts/image-tag.sh)"
          echo "image_tag=$image_tag" >>"$GITHUB_OUTPUT"
          # The agent images are every directory under images/ except the base.
          # Directories only: images/ also holds a README, and feeding that to buildx
          # asks it for the tag ghcr.io/dagsommer/boks/README.md, which it rejects for
          # not being lowercase — a confusing way to learn that a doc is not an image.
          images="$(find images -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -v '^base$' | sort | jq -R . | jq -sc .)"
          echo "images=$images" >>"$GITHUB_OUTPUT"

  # The job that executes third-party code. Every image here runs an installer, a vendor
  # binary, or an unpacked archive we did not write, so this job is assumed to be the one
  # an attacker gets to. It therefore holds no registry credential: `permissions` is
  # read-only and there is no login step. The worst a poisoned build can do is produce a bad
  # artifact, which is still bad — but it cannot publish it, and it cannot steal a token
  # that would let it publish anything else.
  #
  # One runner per architecture rather than QEMU: the arm64 build is native, so it is
  # minutes instead of an hour, and an emulated apt/npm run is its own source of flakiness.
  build:
    needs: tag
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # A throwaway registry on the runner. The agent images are `FROM` the base, and buildx's
    # container driver resolves references through a registry rather than through the local
    # docker image store — so the base has to be somewhere fetchable before anything can
    # build on it, and it must not be GHCR, because this job holds no GHCR credential.
    # Nothing published here outlives the job.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - name: Build every image to an OCI archive
        env:
          IMAGE_TAG: ${{ needs.tag.outputs.image_tag }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          AGENT_IMAGES: ${{ join(fromJSON(needs.tag.outputs.images), ' ') }}
        run: |
          set -euo pipefail
          mkdir -p oci
          staged="localhost:5000/base:${IMAGE_TAG}"

          # The base first, into the local registry, so the agent builds can pull it.
          docker buildx build --platform "$PLATFORM" --tag "$staged" --push images/base

          # Then everything, base included, exported as archives. The base build repeats
          # here but is served from cache; it is exported rather than re-run.
          #
          # Provenance and an SBOM on every image: if we ask people to run our images, they
          # are entitled to know what went into them and which workflow put it there.
          for name in base $AGENT_IMAGES; do
            args=()
            if [ "$name" != base ]; then
              args+=(--build-arg "BASE_IMAGE=${staged}")
            fi
            docker buildx build \
              --platform "$PLATFORM" \
              --provenance=mode=max \
              --sbom=true \
              "${args[@]}" \
              --tag "${IMAGE_REPO}/${name}:${IMAGE_TAG}" \
              --output "type=oci,dest=oci/${name}-${ARCH}.tar" \
              "images/${name}"
          done

      # Assert what the BUILT images will actually run as, out of each OCI archive's own
      # config, rather than trusting the Dockerfiles the previous step read.
      #
      # internal/agent's TestAgentImagesRunAsANumericNonRootUser covers the source side; this
      # covers the artifact, and the two fail for different reasons. A Dockerfile can be right
      # while the image is wrong — a base rebuilt from a stale cache, a `--build-arg
      # BASE_IMAGE` pointing at an older base whose USER was still a name — and the config in
      # the archive is the only place the effective user, inherited or not, is a single value.
      #
      # Why it matters: an image whose USER is a NAME runs as uid 0 on macOS and Windows,
      # because resolving the name needs a mount of the image's Linux filesystem that neither
      # host can perform (see internal/sandbox/imageconfig.go). Nothing errors — the container
      # just runs as root — and the agent that notices is `claude`, which refuses
      # `--dangerously-skip-permissions` as root and so will not start at all.
      - name: Assert every built image runs as a numeric non-root user
        env:
          AGENT_IMAGES: ${{ join(fromJSON(needs.tag.outputs.images), ' ') }}
          # ARCH is set on the build step above rather than on the job, so it has to be
          # repeated here. Without it `set -u` aborted this step on the first expansion, and
          # the failure printed NOTHING — no verdict, no archive name, just exit 1 — which is
          # a worse way to fail than the bug this step exists to catch.
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          fail=0
          for name in base $AGENT_IMAGES; do
            tar="oci/${name}-${ARCH}.tar"
            # Said out loud, because everything below is a pipeline under `set -e`: an
            # archive that is missing or not an OCI layout would otherwise kill the step
            # with no indication of which image or which step of the read went wrong.
            if [ ! -f "$tar" ]; then
              echo "  $name: $tar does not exist — the build did not produce it" >&2
              fail=1; continue
            fi
            # index.json -> possibly a NESTED index -> the image manifest -> its config
            # blob, which is where .config.User lives. Read out of the archive with tar
            # rather than unpacking the whole thing.
            #
            # The descent is a loop because the depth is not fixed and guessing it was the
            # last bug here. Reading index.json's first entry as an image manifest reported
            # "names no config blob" for all nine images: with --provenance=mode=max and
            # --sbom=true, buildx writes index.json pointing at an image INDEX, which then
            # holds the image manifest beside its attestation manifests. So one level down is
            # still an index, and .config only appears one level below that.
            #
            # Attestation manifests are skipped wherever they appear rather than at a fixed
            # position: their order is not promised, and an attestation's config carries no
            # .config.User, so selecting one would report a correct image as root. They are
            # the entries carrying vnd.docker.reference.type.
            pick='[.manifests[]? | select((.annotations["vnd.docker.reference.type"] // "")
                                         != "attestation-manifest")][0].digest // ""'
            digest="$(tar -xOf "$tar" index.json | jq -r "$pick" | cut -d: -f2)"
            config_digest=""
            # Bounded, so a cyclic or unexpectedly deep index cannot spin here.
            for _ in 1 2 3 4; do
              [ -n "$digest" ] || break
              blob="$(tar -xOf "$tar" "blobs/sha256/${digest}")"
              cfg="$(printf '%s' "$blob" | jq -r '.config.digest // ""')"
              if [ -n "$cfg" ]; then
                config_digest="${cfg#sha256:}"
                break
              fi
              digest="$(printf '%s' "$blob" | jq -r "$pick" | cut -d: -f2)"
            done
            if [ -z "$config_digest" ]; then
              echo "  $name: no image config found in $tar — index.json led to no manifest" \
                "carrying .config" >&2
              fail=1; continue
            fi
            user="$(tar -xOf "$tar" "blobs/sha256/${config_digest}" \
              | jq -r '.config.User // ""')"

            case "$user" in
              # uid:gid, both non-zero. The leading digit check rejects names, and the
              # explicit 0 cases reject root written either way.
              0|0:*|root|root:*|"")
                echo "  $name: USER '${user:-<unset>}' — runs as ROOT" >&2; fail=1 ;;
              [1-9]*:[1-9]*)
                echo "  $name: USER $user" ;;
              [1-9]*:0)
                echo "  $name: USER '$user' — uid is fine, but the group is root's" >&2; fail=1 ;;
              [0-9]*)
                echo "  $name: USER '$user' — needs the numeric uid:gid form" >&2; fail=1 ;;
              *)
                echo "  $name: USER '$user' — a NAME becomes uid 0 off Linux" >&2; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more images would run as root, or as a user only Linux can resolve." >&2
            echo "See images/base/Dockerfile above its USER line for why this is numeric." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oci-${{ matrix.arch }}
          path: oci/*.tar
          retention-days: 3
          compression-level: 0 # already compressed layers

  # The job that holds the credential. It runs no third-party code: it downloads the
  # archives the build produced and copies bytes into the registry. Splitting it out is the
  # whole point — `packages: write` never coexists with someone else's install script in the
  # same runner. Do not merge this back into `build` for tidiness.
  push:
    needs: [tag, build]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oci-*
          path: oci
          merge-multiple: true

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push each architecture, then join them into one multi-arch tag
        env:
          IMAGE_TAG: ${{ needs.tag.outputs.image_tag }}
          AGENT_IMAGES: ${{ join(fromJSON(needs.tag.outputs.images), ' ') }}
        run: |
          set -euo pipefail
          for name in base $AGENT_IMAGES; do
            for arch in amd64 arm64; do
              # --all carries the attestation manifests alongside the image manifest.
              skopeo copy --all \
                "oci-archive:oci/${name}-${arch}.tar" \
                "docker://${IMAGE_REPO}/${name}:${IMAGE_TAG}-${arch}"
            done
            # The per-arch tags stay published: they are what the index points at, and
            # deleting them would break the multi-arch tag that references them.
            docker buildx imagetools create \
              --tag "${IMAGE_REPO}/${name}:${IMAGE_TAG}" \
              "${IMAGE_REPO}/${name}:${IMAGE_TAG}-amd64" \
              "${IMAGE_REPO}/${name}:${IMAGE_TAG}-arm64"
          done
