# Keep the Go tree building for Windows.
#
# Boks does not run on Windows and this workflow does not claim it does. What it defends is
# narrower and worth defending on its own: **the Go tree currently compiles for
# `windows/amd64` and `windows/arm64`, including every test binary.** That is a real property,
# it was expensive to reach, and nothing was watching it — before this workflow there was no
# Go CI at all, on any platform, so `go build` and `go test` ran nowhere but a developer's
# laptop. The first `syscall.Mount` typed into a file without a build tag would have silently
# taken it away.
#
# The split between the two jobs is the honesty line, and it is the reason this file is
# shaped the way it is:
#
#   `cross` is the part we can stand behind. Cross-compiling is deterministic, it was run
#   locally before this workflow was written, and it passed for both Windows architectures.
#   It is a required check.
#
#   `native` is the part we can only partly stand behind. A binary that links is not a
#   binary that works, and `go test` on a real Windows host exercises code that has never
#   executed there. So the tests run in two steps rather than one: everything that is
#   expected to pass is **required**, and the two packages the port has genuinely not
#   reached are `continue-on-error`.
#
#   That split is a ratchet, and it is written as an *exclusion* on purpose — the required
#   step is "every package except these two", so a package added tomorrow is required by
#   default and the tolerated list can only ever shrink. A red step that tells the truth is
#   worth more than a green one that does not; a required step is worth more than either,
#   and this file should keep converting the former into the latter.
#
# See docs/windows.md for why Windows is being pursued at all, and what is still missing.
name: windows

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

# A superseded push has nothing to say. Unlike `pages`, nothing here publishes, so an
# interrupted run leaves nothing half-done.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap guard, and the one whose result was reproduced locally before this file was
  # committed. It runs on Linux because `GOOS=windows go build` needs no Windows machine:
  # roughly thirty seconds on a runner that costs a tenth of what `windows-latest` does.
  #
  # It also covers `windows/arm64`, which the `native` job cannot — GitHub's Windows runners
  # are amd64, so without this job the arm64 build would go unchecked, and nerdbox ships a
  # `windows/arm64` shim.
  #
  # `go vet` rather than `go build` alone is deliberate: `go build ./...` does not look at
  # `_test.go` files, so a test file that stops compiling for Windows would slip past it.
  # `go vet` type-checks the test files too, which is the property we actually want.
  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build every package for windows/${{ matrix.goarch }}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: Vet every package, test files included, for windows/${{ matrix.goarch }}
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

  # The real thing: a Windows host, a native toolchain, and the tests actually executed.
  #
  # This job is what turns "it compiles" into "it runs", and today it only gets halfway.
  # That is the point of running it.
  native:
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, which `windows-latest` ships. The scripts below are then the same shell
        # as everywhere else in this repository rather than PowerShell dialect.
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Not `go build ./...`: this is the artifact a Windows user would be handed, built the
      # way the Makefile builds it, so a linker problem that only shows up when producing an
      # executable shows up here.
      - name: Build the CLI
        run: go build -o boks.exe ./cmd/boks

      # It has to at least start and know its own name. This is a low bar on purpose — it is
      # the one runtime assertion in this job that is expected to hold today.
      - name: The binary runs
        run: ./boks.exe --version

      - name: Vet
        run: go vet ./...

      # ---------------------------------------------------------------------------------
      # REQUIRED. Every package except the two named in the next step, selected by exclusion
      # so that a package added tomorrow lands here rather than silently going untested.
      #
      # Six packages used to fail on this runner. Four of them were ordinary test-portability
      # bugs with no bearing on the port, and they have been fixed:
      #
      #   internal/policy    TestStorePermissions' Windows guard is a runtime.GOOS check with
      #                      the reason written out, and TestUnreadableStoreFailsClosed no
      #                      longer assumes mode 0o000 denies reads — on Windows that only
      #                      sets FILE_ATTRIBUTE_READONLY. The fail-closed property it covers
      #                      is reached on every platform by TestUnopenableStoreFailsClosed.
      #   internal/secret    TestFileStoreIsEncryptedAndPrivate narrows the perm&0o077 check
      #                      rather than skipping the test, so Windows still runs the
      #                      assertions that the store is ciphertext and leaks no service name.
      #   internal/sandbox   copy_test.go treats a failed os.Symlink as fatal everywhere
      #                      except Windows, where the privilege is absent without Developer
      #                      Mode, and guards the 0o600 assertion the same way.
      #   internal/cli       hostPath absolutises on both platforms, so cp_test.go compares
      #                      against filepath.Abs rather than a Unix literal; and the docs
      #                      generator now rewrites the whole computed decision-log path, not
      #                      a prefix of it, so docs/cli.md renders identically wherever it is
      #                      generated. That last one was failing on macOS too.
      #
      # Each fix is guarded on runtime.GOOS, never on an environment variable — store_test.go
      # once guarded on os.Getenv("GOOS"), which `go test` does not set, so the skip fired on
      # no platform at all. internal/ca, internal/runtimecfg and internal/workspace already
      # use the runtime.GOOS pattern; copy it rather than inventing another.
      #
      # What the mode guards give up on Windows is a real hole, not a formality: nothing then
      # verifies that another local user cannot read the secret store, the policy store, or a
      # file `boks cp` pulled out of a sandbox. See "Host-side file permissions are not
      # enforced on Windows" in docs/windows.md.
      # ---------------------------------------------------------------------------------
      - name: Test every package the port has reached
        run: |
          set -euo pipefail
          go test $(go list ./... | grep -Ev '/internal/(network|enforce)(/|$)')

      # ---------------------------------------------------------------------------------
      # EXPECTED TO FAIL. Do not delete this step and do not fold it into the one above —
      # either would convert a known gap into a silent one.
      #
      # These two are the port itself, not test bugs. checkSocketPath in
      # internal/network/network.go refuses outright on Windows ("the VM runtime does not
      # support Windows yet"), so every test that builds a Plan fails, and internal/enforce's
      # shared testSpec helper builds one. That refusal is correct behaviour for today; the
      # tests are simply ahead of the port.
      #
      # MOVE THEM UP WHEN: they pass here. The change that does it is the guest link moving
      # from unixgram to unixstream — see internal/network/gateway_windows.go, which explains
      # why that is the one change that matters, and docs/windows.md section 8. When they go
      # green, delete this step and the exclusion in the step above together; do not leave a
      # tolerated step with nothing left to tolerate.
      # ---------------------------------------------------------------------------------
      - name: Test the two packages blocked on the port (expected to fail)
        id: blocked
        continue-on-error: true
        run: go test ./internal/network/... ./internal/enforce/... 2>&1 | tee blocked-output.txt

      # Puts the verdict on the run's summary page rather than leaving it buried in a log
      # that people stop opening once they learn the step is allowed to fail.
      - name: Record what the blocked packages did
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## \`go test\` on windows-latest"
            echo
            echo "Every other package is tested by the required step before this one; if the"
            echo "job got here, they passed."
            echo
            if [ "${{ steps.blocked.outcome }}" = success ]; then
              echo "**\`internal/network\` and \`internal/enforce\` passed.** The port has"
              echo "reached them. Delete the tolerated step in"
              echo "\`.github/workflows/windows.yml\` and the exclusion in the required step"
              echo "above it, so that \`go test ./...\` is required whole."
            else
              echo "**\`internal/network\` and \`internal/enforce\` failed, as expected.**"
              echo "\`checkSocketPath\` refuses on Windows by design; see the comment above"
              echo "that step for the change that makes them pass."
              echo
              echo '```'
              grep -E '^(FAIL|--- FAIL)' blocked-output.txt || true
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
