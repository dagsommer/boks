# Build the guest kernel and rootfs a sandbox boots, and publish them as artifacts.
#
# WHY THIS EXISTS. A `boks` binary cannot start a sandbox on its own: it needs a guest kernel
# and an EROFS rootfs for the microVM to boot. nerdbox builds both with Docker Buildx, and its
# own release workflow has failed on every tag since v0.2.0 — all ten of its GitHub releases
# carry zero assets — so there is nothing to download for any platform. Anyone bringing Boks
# up on a new machine has to build them, which needs Docker and a Linux builder.
#
# That is a poor thing to ask of someone testing the Windows port, whose machine has neither.
# This job does it once, on a Linux runner, and leaves the artifacts attached to the run.
#
# Both outputs are architecture-specific and byte-reproducible enough to check: the job writes
# a SHA256SUMS into the artifact, so a file that arrives somewhere else can be shown to be the
# same file. release.yml checks exactly that file before it puts either into a release archive.
#
# `workflow_call` exists so release.yml can build the guest at the tag. It takes the same
# `arch` input as `workflow_dispatch` — one architecture per run, because the bake recipe
# builds one at a time — so release.yml calls it twice, once per architecture.
#
# THE LICENCE. The kernel here is Linux, GPL-2.0, patched by nerdbox. Publishing the compiled
# result carries a corresponding-source obligation; the recipe is entirely public, and
# release.yml writes a SOURCE.txt naming the exact revision and the two bake commands into
# every guest archive it publishes.
name: guest-image

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Guest architecture"
        required: false
        default: x86_64
        type: choice
        options: [x86_64, arm64]
  workflow_call:
    inputs:
      arch:
        description: "Guest architecture"
        required: false
        default: x86_64
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/guest-image.yml"
      - "packaging/nerdbox/NERDBOX_REV"

permissions:
  contents: read

# The architecture is in the group as well as the ref: release.yml calls this twice on one
# ref, and without it the second call would cancel the first. `github.workflow` is the
# caller's workflow name under workflow_call, which keeps a release build and a push-triggered
# run on `main` apart.
concurrency:
  group: ${{ github.workflow }}-guest-image-${{ github.ref }}-${{ inputs.arch || 'x86_64' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: boks

      - name: Read the pinned nerdbox revision
        id: pin
        run: |
          set -euo pipefail
          rev="$(grep -v '^[[:space:]]*#' boks/packaging/nerdbox/NERDBOX_REV | tr -d '[:space:]')"
          if [ "${#rev}" -ne 40 ]; then
            echo "NERDBOX_REV must be a full 40-character SHA, got '${rev}'" >&2
            exit 1
          fi
          echo "rev=$rev" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: containerd/nerdbox
          ref: ${{ steps.pin.outputs.rev }}
          path: nerdbox
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # The kernel is an ELF vmlinux rather than a bzImage — that is the format
      # `krun_set_kernel` takes, and it is what nerdbox's own instance.go looks for under the
      # name `nerdbox-kernel-<arch>`. Do not "fix" it into a bzImage.
      # nerdbox spells this architecture `arm64`, not `aarch64`, in three places that must
      # agree: the kernel config it ships (kernel/config-<version>-arm64), the ARCH it hands
      # to Linux's kbuild, and — decisively — the name the shim looks the kernel up by at
      # boot, which is Go's GOARCH with only amd64 rewritten to x86_64.
      #
      # This workflow passed `aarch64` until 2026-08-15. Nothing caught it because the
      # matrix that calls this twice lives in release.yml, which had never run: a standalone
      # guest-image run builds the default x86_64 only. The failure would have been
      # `COPY kernel/config-6.12.44-aarch64` naming a file nerdbox does not ship — a build
      # error about a missing config, several layers away from the word that caused it.
      #
      # linux-runtime.yml documents this same trap and avoids it. Hence the check: an
      # architecture this recipe has no config for stops here, saying so.
      - name: Reject an architecture nerdbox has no kernel config for
        run: |
          set -euo pipefail
          arch='${{ inputs.arch || 'x86_64' }}'
          # Globbed rather than built from the pinned kernel version, so that a version bump
          # in nerdbox does not silently turn this check into one that rejects everything.
          # An earlier attempt parsed the version out of docker-bake.hcl with `grep -oP`,
          # which is line-based and so never matched the multi-line HCL block: every
          # architecture, including the correct ones, was rejected for want of
          # `config--x86_64`. Tested against nerdbox's real filenames this time.
          shopt -s nullglob
          configs=(nerdbox/kernel/config-*-"${arch}")
          if [ ${#configs[@]} -eq 0 ]; then
            echo "nerdbox ships no kernel config for architecture '${arch}'." >&2
            echo "It ships:" >&2
            ls nerdbox/kernel/config-* >&2
            echo "Note that nerdbox names 64-bit ARM 'arm64', not 'aarch64' — the shim looks" >&2
            echo "the kernel up by Go's GOARCH, so a guest built as 'aarch64' is never found." >&2
            exit 1
          fi
          echo "using ${configs[*]}"

      # KERNEL_ARCH is the kernel's variable and only the kernel's. The rootfs takes its
      # architecture from the TARGET PLATFORM, which nerdbox's bake file never sets for that
      # target — `target "rootfs"` inherits `_guest_common`, and only `_host_common` and
      # `libkrun` reference the `_DOCKER_ARCH` mapping. With no platform, buildx builds for
      # this runner, which is x86_64, and the Dockerfile's rootfs stages follow it:
      # `vminit-build` is `GOARCH=${TARGETARCH} go build`, `crun-build` wgets
      # `crun-…-linux-${TARGETARCH}`.
      #
      # So every arm64 guest this workflow published up to v0.1.1 carried an ARM64 kernel and
      # an x86_64 /sbin/vminitd — byte-identical to the x86_64 archive's — and a Mac booting
      # it panicked with `Requested init /sbin/vminitd failed (error -8)`, ENOEXEC, naming
      # neither architecture nor file. Setting the platform is the fix; the assertion below
      # reading vminitd's own e_machine is what stops it coming back.
      #
      # Cross-building needs no QEMU here: every stage that runs a command is
      # `FROM --platform=$BUILDPLATFORM`, so the platform changes TARGETARCH and not where
      # the work happens. Only `rootfs` is pinned — the kernel target already cross-compiles
      # from KERNEL_ARCH with an explicit CROSS_COMPILE, and is proven to by the same script.
      - name: Build the guest kernel and rootfs
        working-directory: nerdbox
        env:
          KERNEL_ARCH: ${{ inputs.arch || 'x86_64' }}
          DESTDIR: ./_output
        run: |
          set -euo pipefail
          case "${KERNEL_ARCH}" in
            arm64)  docker_arch=arm64 ;;
            x86_64) docker_arch=amd64 ;;
            *) echo "no Docker platform mapping for KERNEL_ARCH=${KERNEL_ARCH}" >&2; exit 1 ;;
          esac
          docker buildx bake kernel
          docker buildx bake rootfs --set "rootfs.platform=linux/${docker_arch}"
          ls -l _output/

      # /sbin/vminitd has to come out of a compressed EROFS image, and this runner cannot do
      # it: `fsck.erofs --path=` needs erofs-utils 1.8, and Ubuntu 24.04 ships 1.7.1. Given
      # that option it rejects it, prints its usage and exits 1 — which the first version of
      # this step reported as a broken rootfs, blaming the artifact for the tool.
      #
      # So the extraction happens in a container instead, in the same Debian release whose
      # mkfs.erofs wrote the image (nerdbox's Dockerfile installs erofs-utils from Debian), so
      # the reader is by construction able to read what the writer produced. The script then
      # takes the extracted file with --init-binary and does the ELF reading, which needs no
      # erofs support at all. It still exits 2 rather than 0 if it is ever asked to extract
      # with a tool that cannot — "the check could not be made" is not a pass.
      - name: Extract the guest init binary for the assertion below
        working-directory: nerdbox
        run: |
          set -euo pipefail
          rm -rf /tmp/guest-init && mkdir -p /tmp/guest-init
          docker run --rm \
            -v "$PWD/_output:/out:ro" -v /tmp/guest-init:/work \
            debian:trixie-slim sh -euc '
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends erofs-utils >/dev/null
              fsck.erofs --version | head -1
              fsck.erofs --extract=/work/vminitd --path=/sbin/vminitd /out/nerdbox-rootfs.erofs
            '
          ls -l /tmp/guest-init/vminitd

      # ---------------------------------------------------------------------------------
      # Assert what was BUILT, not what was asked for. Until 2026-08-16 nothing in this
      # workflow opened either output: the only check was `sha256sum` of the two files
      # against themselves, which is true of any two files, and the architecture guard above
      # globs the checked-out REPOSITORY's kernel configs rather than the artifact. Hardcode
      # `KERNEL_ARCH: x86_64` and an `arm64` run stays entirely green while producing an
      # x86_64 kernel that release.yml then lays into `boks-guest_<v>_arm64.tar.gz` beside a
      # SOURCE.txt saying arm64. Reproduced against a staged `_output/` before this was
      # written.
      #
      # assert-guest-image.py checks the filenames the shim looks these up by, refuses a
      # kernel named for any other architecture, reads the architecture out of the kernel
      # image itself, and — since 2026-08-17 — extracts /sbin/vminitd from the rootfs and
      # reads its e_machine too. The rootfs half is the one that matters most: the kernel's
      # architecture is at least in its filename, while the rootfs is called
      # `nerdbox-rootfs.erofs` in every archive of every architecture, so a mismatched one is
      # invisible to every other check in this repository. It uses assert-elf.py's reader for
      # both the x86_64 vmlinux and vminitd; the arm64 kernel is an arm64 Image and not an ELF
      # at all, so the kernel's format is identified rather than assumed — see the script.
      # ---------------------------------------------------------------------------------
      - name: Assert the built guest image is the architecture it will be labelled
        run: |
          set -euo pipefail
          python3 boks/packaging/linux/assert-guest-image.py nerdbox/_output \
            --arch '${{ inputs.arch || 'x86_64' }}' \
            --init-binary /tmp/guest-init/vminitd

      # The control. The assertion above is only evidence if it can fail, and the way it
      # would fail in production is precisely a kernel built for the other architecture — so
      # that is what is staged, out of this build's own kernel, and it must be rejected.
      # Exit status EXACTLY 1: the script exits 2 for a bad path or bad arguments, so
      # accepting any non-zero status would let a typo pass the control while testing
      # nothing.
      - name: Prove the guest-image assertion can fail
        run: |
          set -euo pipefail
          arch='${{ inputs.arch || 'x86_64' }}'
          # `if`, not `[ ... ] && other=...`: under `set -e` that compound returns the test's
          # status and would abort the step on the x86_64 build, which is the branch this
          # control is most likely to run on.
          if [ "$arch" = arm64 ]; then other=x86_64; else other=arm64; fi
          rm -rf /tmp/guest-control
          mkdir -p /tmp/guest-control
          cp "nerdbox/_output/nerdbox-kernel-$arch" "/tmp/guest-control/nerdbox-kernel-$other"
          cp nerdbox/_output/nerdbox-rootfs.erofs /tmp/guest-control/
          set +e
          python3 boks/packaging/linux/assert-guest-image.py /tmp/guest-control --arch "$other" \
            >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "CONTROL FAILED: a $arch kernel named nerdbox-kernel-$other was not rejected" >&2
            echo "expected exit 1 (ran and rejected), got $rc" >&2
            exit 1
          fi
          echo "  rejected, as it must: a $arch kernel offered as $other"
          rm -rf /tmp/guest-control

      # The rootfs control, and it needs to be its own step rather than to lean on the one
      # above. That control stages a wrong-arch KERNEL, which fails the kernel assertion, so
      # it would exit 1 whether or not the init binary were ever read — it cannot tell whether
      # check 5 ran. This one leaves the kernel correct and correctly named, so exit 1 can
      # only have come from the init binary.
      #
      # What it stages is this build's own vminitd with ONE FIELD CHANGED: e_machine, flipped
      # to the other architecture. That is exactly the defect that shipped — an init binary for
      # the wrong machine — rather than a corrupt file that any check might reject for any
      # reason.
      #
      # It reuses the binary extracted above and passes it with --init-binary, so it needs no
      # erofs-utils on the runner: repacking an image here would only re-test the extraction,
      # which this runner's 1.7.1 cannot do anyway. Exit status EXACTLY 1 — the script exits 2
      # for a bad path or a check it could not make, and accepting any non-zero status would
      # let "could not check" pass as "correctly rejected", which is the failure mode this
      # whole control exists to rule out.
      - name: Prove the init-binary assertion can fail
        run: |
          set -euo pipefail
          arch='${{ inputs.arch || 'x86_64' }}'
          cp /tmp/guest-init/vminitd /tmp/guest-init/vminitd.flipped
          # e_machine is Elf64_Half at offset 18. 183 is aarch64, 62 is x86-64; whichever it
          # is, write the other one. Python because this is a two-byte poke in a 13 MB file.
          python3 - <<'PY'
          import struct
          path = "/tmp/guest-init/vminitd.flipped"
          data = bytearray(open(path, "rb").read())
          was = struct.unpack_from("<H", data, 18)[0]
          struct.pack_into("<H", data, 18, 62 if was == 183 else 183)
          open(path, "wb").write(data)
          print(f"  staged a vminitd with e_machine {was} rewritten to "
                f"{struct.unpack_from('<H', data, 18)[0]}")
          PY
          set +e
          python3 boks/packaging/linux/assert-guest-image.py nerdbox/_output \
            --arch "$arch" --init-binary /tmp/guest-init/vminitd.flipped >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "CONTROL FAILED: a vminitd that is not $arch was not rejected" >&2
            echo "expected exit 1 (ran and rejected), got $rc" >&2
            echo "rc=2 means the assertion could not be made and check 5 never ran" >&2
            exit 1
          fi
          echo "  rejected, as it must: a non-$arch /sbin/vminitd"
          rm -f /tmp/guest-init/vminitd.flipped

      # The names in SHA256SUMS are bare, not `_output/`-prefixed, because the artifact is
      # flattened: whoever downloads it gets the files at the top level and needs
      # `sha256sum -c SHA256SUMS` to work there without editing the file first. Written with a
      # redirect rather than `| tee` into the same directory the glob covers — in a pipeline
      # the shell may create the output file before the glob is expanded, and SHA256SUMS would
      # then list itself as empty.
      - name: Checksums
        working-directory: nerdbox/_output
        run: |
          set -euo pipefail
          files=(*)
          sha256sum -- "${files[@]}" >SHA256SUMS
          cat SHA256SUMS
          {
            echo "## Guest image"
            echo
            echo "nerdbox \`${{ steps.pin.outputs.rev }}\`, arch \`${{ inputs.arch || 'x86_64' }}\`."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Put both files on PATH, or in a directory named by \`LIBKRUN_PATH\`, next to"
            echo "\`krun.dll\`/\`libkrun.so\` and the nerdbox shim."
            echo
            echo "The kernel is Linux and therefore GPL-2.0. \`release.yml\` writes a"
            echo "\`SOURCE.txt\` naming the exact nerdbox revision and the bake commands that"
            echo "reproduce it into every guest archive it publishes."
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nerdbox-guest-${{ inputs.arch || 'x86_64' }}
          path: nerdbox/_output/*
          if-no-files-found: error
          retention-days: 30
