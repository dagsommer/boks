# Build the boks binaries, the packages, and the runtime a sandbox actually needs, and
# publish all of it against one tag.
#
# This workflow deliberately mirrors the shape of images.yml — resolve the version once,
# build without a credential, publish with one — for the reason given on that file's `push`
# job. Read it before reorganising this one. The two run on the same `v*` tag and take the
# version from the same place (scripts/image-tag.sh, which reads internal/agent.ImageTag),
# so the images published for a tag and the binary that resolves agents to them can never
# be built against two different opinions of what the version is.
#
# What is built, and what is not:
#
#   darwin/arm64   verified end to end: the VM boundary and the network policy were both
#                  measured there. See docs/verification.md.
#   linux/amd64    verified end to end on 2026-08-15, in WSL2 on Ubuntu 26.04 — 25 of 26
#                  checks passed, and the one failure was the tester's own and was proved
#                  so. No bare-metal Linux run is recorded.
#   linux/arm64    builds and passes its tests; nothing has ever been run on it.
#   windows/amd64  verified end to end on 2026-08-15, unelevated: `boks run` boots a Linux
#                  guest through WHP, the policy engine judges real traffic, and teardown
#                  leaves nothing. One machine, `--net nat`.
#
#   darwin/amd64   not shipped. `boks doctor` hard-fails on Intel Macs with "no supported
#                  hypervisor on amd64" and always will: libkrun uses Hypervisor.framework
#                  in a configuration that needs Apple silicon.
#   windows/arm64  not shipped. The CLI cross-builds, but there is no runtime under it:
#                  krun.dll is built for x86_64-pc-windows-msvc only, and mkfs.erofs.exe
#                  has no aarch64 recipe (go-erofs cross-compiles for x86-64 alone). A
#                  binary whose only possible output is a refusal makes the platform look
#                  supported and moves the disappointment later.
#
# ---------------------------------------------------------------------------------------
# THE RUNTIME, AND HOW IT GETS HERE
#
# A `boks` binary on its own cannot start a sandbox. It needs a nerdbox shim, a libkrun,
# and a guest kernel and rootfs; on Windows it also needs a patched containerd, `ctr` and
# `mkfs.erofs.exe`. Every one of those is built by another workflow in this directory, and
# until now every one of them expired as an artifact — see docs/distribution.md, "How the
# runtime crosses a workflow boundary".
#
# Those workflows are now REUSABLE, and this one CALLS them. `actions/download-artifact`
# cannot reach another workflow's run without a run id and a token, and the alternative —
# `gh run download` from the latest green run on `main` — would publish bytes built from
# some other commit than the tag. A called workflow runs at the caller's ref and uploads
# into the caller's run, so the artifacts here are provably the tag's, and a plain
# `download-artifact` can see them.
#
# The cost is that a tag build now compiles libkrun for Windows, which is slow. A tag is
# rare; a release whose runtime came from an unknown commit is a permanent problem.
#
# The `paths:` filters on those workflows are not an obstacle: a path filter constrains the
# event it is written under, and `workflow_call` is a different event with no filter.
# ---------------------------------------------------------------------------------------
# THE WINDOWS ARCHIVE IS ONE FILE, AND THREE THINGS DEPEND ON ITS SHAPE
#
# `boks_<v>_windows_amd64.zip` carries the CLI, the runtime AND the guest kernel and rootfs
# in one flat directory. It is the winget target and the recommended Windows download, and
# there is deliberately no Windows CLI-only tarball beside it — that would be a strict
# subset whose only distinguishing property is that it cannot start a sandbox.
#
#   packaging/winget/manifests declares RelativeFilePath as
#   `boks_<v>_windows_amd64/boks.exe`. The `assemble` job asserts that path exists rather
#   than letting a bot in someone else's repository find out.
#
#   .zip, not .tar.gz, because winget's InstallerType has no tar.gz — zip is the only
#   archive it unpacks. Windows 10+ does ship `tar`, which is why the Windows CLI used to
#   be a tarball; that reason does not survive winget needing a zip anyway.
#
#   The guest is in it, so a winget install boots with no further download. That makes the
#   kernel travel in two kinds of archive, so `assemble` writes the GPL-2.0 SOURCE.txt into
#   both. See docs/distribution.md, "What goes in the Windows archive, and the guest".
# ---------------------------------------------------------------------------------------
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub release (otherwise build only)"
        type: boolean
        default: false

# Nothing at the top level gets more than read. Each job asks for what it needs.
permissions:
  contents: read

env:
  # Pinned rather than "stable": which compiler produced a released binary is a fact about
  # that binary, and "whatever was newest that morning" is not a fact anyone can check.
  GO_VERSION: "1.26.0"

jobs:
  # Resolve the version once, from internal/agent, and refuse a tag that disagrees with it.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        run: echo "version=$(scripts/image-tag.sh)" >>"$GITHUB_OUTPUT"

  # A tag whose tree does not pass its own tests must not become a release. This is the
  # cheapest possible gate and it runs before anything is built — including, now, before the
  # runtime workflows, so a failing test costs seconds rather than a Windows Rust build.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change: $unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  # The job that compiles. It holds no credential — `permissions` is read-only and there is
  # no login or release step — so the worst a poisoned dependency in the module graph can do
  # is produce a bad artifact. It cannot publish it, and there is no token here worth
  # stealing. This is the same split images.yml makes, for the same reason.
  #
  # One runner for every target, unlike images.yml: nothing in Boks uses cgo, so these are
  # ordinary cross-compilations and a native runner per architecture would buy nothing. The
  # arm64 .deb and .rpm are built here too, since both formats are just archives of files
  # that were produced somewhere else.
  build:
    # runtime-linux is needed because the .deb and .rpm now contain the runtime rather than
    # naming it as a dependency: no distribution ships a containerd at the 2.3 floor, so a
    # package that only declared one would install a machine that looks provisioned and
    # cannot start a sandbox. The darwin and windows legs of the matrix do not use it and
    # wait for it anyway, which costs wall-clock and keeps the graph readable.
    needs: [version, check, runtime-linux]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      # The default shallow checkout is enough: build-release.sh takes SOURCE_DATE_EPOCH
      # from `git log -1`, which the tip commit satisfies.
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: Build the tarball
        run: scripts/build-release.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ needs.version.outputs.version }}"

      # The bundle carries containerd, the nerdbox shim and libkrun.so for this
      # architecture, already checked against its own SHA256SUMS by the job that made it.
      # package-linux.sh takes the directory as-is and ignores what it does not want, so
      # nothing is unpacked or renamed here.
      - uses: actions/download-artifact@v4
        if: matrix.goos == 'linux'
        with:
          name: boks-runtime-linux-${{ matrix.goarch }}
          path: runtime-assets

      - name: Build the Linux packages
        if: matrix.goos == 'linux'
        env:
          # Required by package-linux.sh. Unset, it refuses to build rather than quietly
          # producing the CLI-only package that this release is meant to stop shipping —
          # which is why it is passed explicitly here rather than defaulted in the script.
          BOKS_RUNTIME_ASSETS: ${{ github.workspace }}/runtime-assets
        run: |
          set -euo pipefail
          # rpm ships rpmbuild; dpkg-deb is already on the runner. Distribution tools, not
          # a packaging binary downloaded from somewhere.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          scripts/package-linux.sh "${{ matrix.goarch }}" "${{ needs.version.outputs.version }}"

      - name: Check the artifacts against their own checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for sum in *.sha256; do sha256sum -c "$sum"; done

      # The Windows leg is named OUT of the `dist-*` pattern that `publish` collects, because
      # its tarball is an input to `assemble` rather than a release asset. The Windows CLI
      # ships inside boks_<v>_windows_amd64.zip together with the runtime and guest it cannot
      # start a sandbox without; publishing a CLI-only tarball beside that bundle would offer
      # a smaller download whose only distinguishing property is that it does not work. It is
      # still BUILT here, by the same script and the same matrix entry as every other target,
      # so `make dist` and RELEASE_TARGETS stay honest and internal/release's test still
      # compares like with like.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos == 'windows' && 'cli-windows-amd64' || format('dist-{0}-{1}', matrix.goos, matrix.goarch) }}
          path: dist/*
          retention-days: 7
          compression-level: 0 # tarballs, debs and rpms are already compressed

  # ---------------------------------------------------------------------------------------
  # The runtime. Five calls into the workflows that already build these pieces, so nothing
  # here duplicates a build recipe — if one of those workflows is wrong, it is wrong in one
  # place and both its own runs and this one are wrong together.
  #
  # Each is gated on `check` rather than on `version`: they build no Boks code and do not
  # need the version string, but a tag whose tests fail should not spend forty minutes
  # compiling libkrun. They keep `contents: read`, matching what each declares for itself.
  # ---------------------------------------------------------------------------------------

  # libkrun.so and containerd-shim-nerdbox-v1 for linux/amd64 and linux/arm64.
  runtime-linux:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/linux-runtime.yml

  # The guest kernel and EROFS rootfs. One call per guest architecture, because the recipe
  # builds one at a time; the artifact names carry the architecture, so they do not collide.
  runtime-guest:
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/guest-image.yml
    with:
      arch: ${{ matrix.arch }}

  # krun.dll. Slow — a full Rust workspace on a Windows runner.
  runtime-krun-dll:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/libkrun-windows.yml

  # containerd-shim-nerdbox-v1.exe.
  runtime-windows-shim:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/nerdbox-windows.yml

  # containerd.exe, ctr.exe, mkfs.erofs.exe, and the configuration and root-creation script
  # that an unelevated containerd on Windows does not work without.
  runtime-windows-containerd:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/containerd-windows.yml

  # ---------------------------------------------------------------------------------------
  # Lay the runtime pieces out the way a user needs them and name them after the tag.
  #
  # This job compiles nothing and holds no credential, exactly like `build`. It is separate
  # from `publish` for the same reason `build` is: the job that writes bytes and the job that
  # holds `contents: write` are not the same job.
  #
  # Every incoming artifact is checked against the checksums its producing workflow wrote
  # before anything is copied out of it, and every asset this job writes gets a `.sha256`
  # that `publish` checks again. That is the same chain the CLI tarballs already have, one
  # hop longer.
  # ---------------------------------------------------------------------------------------
  assemble:
    needs:
      [
        version,
        build,
        runtime-linux,
        runtime-guest,
        runtime-krun-dll,
        runtime-windows-shim,
        runtime-windows-containerd,
      ]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # For packaging/nerdbox/NERDBOX_REV, which names the guest kernel's source revision.
      - uses: actions/checkout@v5
        with:
          path: boks

      - uses: actions/download-artifact@v4
        with:
          name: boks-runtime-linux-amd64
          path: in/linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: boks-runtime-linux-arm64
          path: in/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: nerdbox-guest-x86_64
          path: in/guest-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: nerdbox-guest-aarch64
          path: in/guest-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: krun-dll-windows-amd64
          path: in/krun-dll
      - uses: actions/download-artifact@v4
        with:
          name: containerd-shim-nerdbox-v1-windows
          path: in/windows-shim
      - uses: actions/download-artifact@v4
        with:
          name: containerd-windows-amd64-bundle
          path: in/windows-containerd
      # The Windows CLI, from this workflow's own `build` job. It is the one incoming piece
      # that is not a runtime artifact: boks_<v>_windows_amd64.zip is the CLI and the stack
      # under it in one archive, so the CLI has to reach this job to be put in it.
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-amd64
          path: in/windows-cli

      # Not ceremony. Eight artifacts — seven from five called workflows, one from this
      # workflow's own `build` job — are being merged here for the first time, and a truncated
      # download or a mixed-up architecture is invisible afterwards: an amd64 libkrun.so in the
      # arm64 archive looks perfectly well-formed and fails at `dlopen` on a user's machine.
      # Every one of them arrived with a checksum its producer wrote, in one of two shapes;
      # this checks all of them before a byte is copied.
      - name: Verify every incoming artifact against the checksums its builder wrote
        run: |
          set -euo pipefail
          # Two shapes, because two kinds of producer. The runtime workflows each write a
          # SHA256SUMS covering their own output. The `build` job in this workflow writes a
          # per-file `.sha256` beside each tarball instead, which build-release.sh has done
          # since before any of this existed. Both are checked; a directory carrying neither
          # is a mistake to fail on rather than a case to skip, because a skip here is
          # indistinguishable from a check that passed.
          for d in in/*/; do
            echo "::group::$d"
            if [ -f "$d/SHA256SUMS" ]; then
              (cd "$d" && sha256sum -c SHA256SUMS)
            elif compgen -G "$d*.sha256" >/dev/null; then
              (cd "$d" && for sum in *.sha256; do sha256sum -c "$sum"; done)
            else
              echo "$d has neither a SHA256SUMS nor a *.sha256 — nothing vouches for it" >&2
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Lay out the release assets
        run: |
          set -euo pipefail
          mkdir -p dist stage

          # The Linux bundles are already the right set of files; they are only renamed for
          # the tag and given a top-level directory, the way the CLI tarballs are.
          for arch in amd64 arm64; do
            d="stage/boks-runtime_${VERSION}_linux_${arch}"
            mkdir -p "$d"
            cp -a "in/linux-$arch/." "$d/"
          done

          # The guest kernel is Linux, so it is GPL-2.0, and nerdbox patches it. Shipping the
          # compiled result carries a corresponding-source obligation; the recipe is entirely
          # public, so the obligation is met by saying precisely which recipe. This is a
          # function rather than an inline heredoc because the kernel now travels in TWO
          # kinds of archive — the guest archives, and the Windows bundle that carries the
          # guest so a winget install boots without a second download. Every archive
          # containing the kernel gets this file. One that did not would be a genuinely new
          # obligation rather than the same one, which is the whole reason it exists.
          rev="$(grep -v '^[[:space:]]*#' boks/packaging/nerdbox/NERDBOX_REV | tr -d '[:space:]')"
          write_source_txt() {
            cat >"$1/SOURCE.txt" <<SRC
          The kernel in this archive is Linux, licensed GPL-2.0, built from the recipe in
          containerd/nerdbox at revision:

            $rev
            https://github.com/containerd/nerdbox/tree/$rev

          Reproduce it with, from a checkout of that revision:

            KERNEL_ARCH=$2 DESTDIR=./_output docker buildx bake kernel
            KERNEL_ARCH=$2 DESTDIR=./_output docker buildx bake rootfs

          That recipe names the exact kernel tarball, configuration and patch series used.
          The pin is recorded in packaging/nerdbox/NERDBOX_REV in dagsommer/boks, and this
          kernel was built by .github/workflows/guest-image.yml.
          SRC
          }

          # The guest. The file names are NOT hardcoded: nerdbox's own bake recipe decides
          # them, they have been spelled at least two ways in this repository's own notes
          # (nerdbox-rootfs.erofs and nerdbox-rootfs-<arch>.erofs), and getting the guess
          # wrong here would silently ship an archive missing the rootfs. Whatever the
          # producing workflow put in the artifact is what goes in.
          for arch in x86_64 aarch64; do
            d="stage/boks-guest_${VERSION}_${arch}"
            mkdir -p "$d"
            cp -a "in/guest-$arch/." "$d/"
            write_source_txt "$d" "$arch"
            ls -l "$d"
          done

          # Windows: one directory, because every piece is useless without the others and a
          # tester collecting them from three artifacts spends the session debugging a
          # missing file. containerd's bundle already carries the config, the root-creation
          # script and the pre-formatted writable layer.
          #
          # This is the runtime WITHOUT the CLI — the complement, for someone who built boks
          # from source on Windows or who is driving containerd and `ctr` by hand the way
          # docs/windows-e2e.md does. The all-in-one archive is built from it below.
          d="stage/boks-runtime_${VERSION}_windows_amd64"
          mkdir -p "$d"
          cp -a in/windows-containerd/. "$d/"
          cp in/krun-dll/krun.dll "$d/"
          # RENAMED, and this matters. nerdbox-windows.yml builds both architectures and so
          # suffixes them; containerd resolves a runtime id to a binary NAME, so
          # io.containerd.nerdbox.v1 looks for containerd-shim-nerdbox-v1.exe exactly. A shim
          # shipped under its build name is a shim containerd will report as missing.
          cp in/windows-shim/containerd-shim-nerdbox-v1-amd64.exe \
            "$d/containerd-shim-nerdbox-v1.exe"
          ls -l "$d"

          # ---------------------------------------------------------------------------------
          # boks_<v>_windows_amd64.zip — the Windows install, in one file.
          #
          # This is the winget target and the recommended Windows download, and it is a
          # SUPERSET of the runtime directory above: the CLI, everything a sandbox needs to
          # run, and the guest kernel and rootfs it boots. There is deliberately no CLI-only
          # Windows tarball to pick instead; see the `build` job's upload step.
          #
          # FLAT, everything beside boks.exe, and that is load-bearing twice over:
          #
          #   1. packaging/winget/manifests declares
          #      NestedInstallerFiles.RelativeFilePath: boks_<v>_windows_amd64/boks.exe.
          #      The check below is that contract, asserted here rather than discovered by a
          #      winget-pkgs bot in someone else's repository.
          #   2. internal/daemon/locate.go's RuntimeDirs() searches the directory the boks
          #      executable resolves to (symlinks followed, which is what winget's portable
          #      alias is), and daemonPath() PREPENDS those directories to the PATH it starts
          #      containerd with. The shim then finds krun.dll, the guest kernel and the
          #      rootfs by scanning that same PATH. So a flat directory needs no PATH entry,
          #      no environment variable and no configuration — provided containerd is
          #      started by `boks daemon start`. Starting the bundled containerd.exe by hand
          #      gets none of it, and docs/install.md says so.
          # ---------------------------------------------------------------------------------
          cli="stage/boks_${VERSION}_windows_amd64"
          tar -xzf "in/windows-cli/boks_${VERSION}_windows_amd64.tar.gz" -C stage
          if [ ! -f "$cli/boks.exe" ]; then
            echo "$cli/boks.exe is missing — the winget manifest's RelativeFilePath names" >&2
            echo "exactly that path, so this layout is a contract and not a convention" >&2
            exit 1
          fi
          # One name collides, and it would collide silently: the CLI tarball carries the
          # repository's README.md and the containerd bundle carries
          # packaging/containerd-windows/README.md under that same name. A plain copy would
          # replace the document a user opens first with one about driving containerd by
          # hand. The runtime's keeps its content under a name that says what it is.
          for f in "$d"/*; do
            case "$(basename "$f")" in
            README.md) cp -a "$f" "$cli/README-windows-runtime.md" ;;
            *) cp -a "$f" "$cli/" ;;
            esac
          done
          # The guest, x86_64 only: there is no aarch64 Windows runtime to boot it with.
          cp -a in/guest-x86_64/. "$cli/"
          write_source_txt "$cli" x86_64
          # Each incoming directory brought its producing workflow's SHA256SUMS along. They
          # are all wrong for this directory and one has just overwritten another; the loop
          # below regenerates it over what is actually here.
          rm -f "$cli/SHA256SUMS"
          ls -l "$cli"

          # Every archive carries a SHA256SUMS covering everything actually in it, replacing
          # whichever partial one came in with an artifact. The incoming ones are wrong by
          # construction after this job has finished with them — the Windows directory has
          # gained a krun.dll and a renamed shim, the guest directories a SOURCE.txt — and a
          # checksum file that silently omits half the archive is worse than none.
          for d in stage/*/; do
            (cd "$d" && rm -f SHA256SUMS && files=(*) && sha256sum -- "${files[@]}" >SHA256SUMS)
            echo "::group::$d"
            cat "$d/SHA256SUMS"
            echo "::endgroup::"
          done

      - name: Archive them, and write a checksum for each
        run: |
          set -euo pipefail
          cd stage
          for d in boks-runtime_*_linux_* boks-guest_*; do
            # Sorted, ownerless, epoch timestamps: the same inputs give the same archive.
            # That is a property of the packing, not of the builds inside it — libkrun and
            # the guest kernel are not claimed to be reproducible.
            tar --sort=name --numeric-owner --owner=0 --group=0 --mtime=@0 \
              -cf - "$d" | gzip -9n >"../dist/$d.tar.gz"
          done
          # zip for Windows, because that is what a Windows machine opens without being told
          # how. -X drops the platform-specific extra fields; it does not make the archive
          # reproducible — zip records real mtimes and directory order — and nothing here
          # claims it is. The SHA256SUMS inside the archive is what a suspicious reader
          # checks, and it is over the files rather than over the container.
          # Both Windows archives: the all-in-one boks_*_windows_amd64.zip that winget
          # installs, and the runtime-only boks-runtime_*_windows_amd64.zip it is a superset
          # of. `boks_` cannot match `boks-runtime_` — the separator differs — so the two
          # globs do not overlap.
          for d in boks_*_windows_* boks-runtime_*_windows_*; do
            TZ=UTC zip -qrX "../dist/$d.zip" "$d"
          done
          cd ../dist
          for f in *; do sha256sum "$f" >"$f.sha256"; done
          ls -l
          cat -- *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-runtime
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # already compressed

  # The job that holds the credential. It compiles nothing and runs no third-party code: it
  # downloads what `build` and `assemble` produced, re-verifies every checksum, signs the
  # combined SHA256SUMS, and creates a release. Keeping it separate is the whole point —
  # `contents: write` never coexists with a compiler and someone else's module graph in the
  # same runner. That now covers the runtime too, which needs it more than the CLI does:
  # these are the binaries that boot VMs on someone's machine.
  publish:
    needs: [version, build, assemble]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the provenance attestation
      attestations: write # record it
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Re-verify every checksum, then join them into one SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # The per-file sums were written next to each artifact by the build and assemble
          # jobs. Checking them here proves the bytes that will be published are the bytes
          # that were built, rather than trusting the artifact upload to have been lossless.
          for sum in *.sha256; do sha256sum -c "$sum"; done
          rm -f -- *.sha256
          sha256sum -- * | sort -k2 >SHA256SUMS
          cat SHA256SUMS

      # Binaries are NOT signed — no Authenticode certificate, no Developer ID — and that is
      # a decision, not an oversight: it costs money and buys a first-run dialog. What is
      # signed is the checksum file, with the same key packaging/apt/ already uses for the
      # repository index, so there is one key to publish and one to rotate rather than two.
      # A detached armored signature over SHA256SUMS covers every asset transitively.
      - name: Sign SHA256SUMS with the archive key
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_KEY_FPR: ${{ secrets.APT_GPG_KEY_FPR }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            # A real tag must not ship an unsigned checksum file. A dispatched dry run may,
            # because it produces a draft nobody can install and the key is deliberately
            # held in one place only — see packaging/apt/README.md.
            if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
              echo "APT_GPG_PRIVATE_KEY is unset — see packaging/apt/README.md" >&2
              exit 1
            fi
            echo "::warning::no signing key available; publishing without SHA256SUMS.asc"
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          signer=()
          if [ -n "${GPG_KEY_FPR:-}" ]; then
            signer=(--local-user "$GPG_KEY_FPR")
          fi
          gpg --batch --yes --armor --detach-sign "${signer[@]}" \
            --output SHA256SUMS.asc SHA256SUMS
          # Verify what was just written, against the key that was just imported. This
          # catches an empty or truncated secret, which otherwise produces a file that looks
          # like a signature and satisfies nobody's `gpg --verify`.
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS

      # Lets anyone run `gh attestation verify <file> --repo dagsommer/boks` and learn which
      # workflow, at which commit, produced the file they downloaded. Asking people to run
      # something that boots VMs on their machine and offering them no way to check where it
      # came from would be a poor trade — and the runtime archives ARE the thing that boots
      # the VM, so they are covered by the same glob rather than by a weaker promise.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          set -euo pipefail
          # A manually dispatched publish has not been through the tag-versus-constant gate
          # — that only fires on a tag ref — and did not build the agent images, which
          # images.yml publishes on the same tag. So it produces a draft for a human to
          # look at, never a release people can install.
          draft=()
          [ "${GITHUB_REF_TYPE:-}" = tag ] || draft=(--draft)
          notes="$(mktemp)"
          cat >"$notes" <<'EOF'
          ## Install

          See [docs/install.md](https://github.com/dagsommer/boks/blob/main/docs/install.md).
          Read it before downloading: a `boks` binary on its own cannot start a sandbox. This
          release carries the rest — the shim, libkrun, the guest kernel and rootfs, and on
          Windows a containerd. On Windows all of it is in one archive; elsewhere the pieces
          are listed separately below.

          Run `boks doctor` first. It checks every prerequisite and prints what to do about
          each gap. `boks daemon start` writes containerd's configuration and supervises it.

          ## What is in this release

          | Asset | What it is |
          |---|---|
          | **`boks_*_windows_amd64.zip`** | **the whole Windows install in one file**: the CLI, the runtime, and the guest kernel and rootfs. Unzip it anywhere. This is what `winget install boks` fetches. |
          | `boks_*.tar.gz` for `linux_amd64`, `linux_arm64` and `darwin_arm64` | the CLI |
          | `boks_*.deb`, `boks_*.rpm` | the CLI **and the Linux runtime**, packaged. `docs/install.md` says what a package puts on the machine. |
          | `boks-runtime_*_linux_amd64.tar.gz`, `_linux_arm64.tar.gz` | `containerd-shim-nerdbox-v1` and `libkrun.so` |
          | `boks-runtime_*_windows_amd64.zip` | the Windows runtime **without** the CLI: `krun.dll`, `containerd-shim-nerdbox-v1.exe`, a patched `containerd.exe` and `ctr.exe`, `mkfs.erofs.exe`, a `config.toml`, `new-containerd-root.ps1` and a pre-formatted writable layer. For a `boks.exe` you built yourself, or for driving containerd by hand. |
          | `boks-guest_*_x86_64.tar.gz`, `_aarch64.tar.gz` | the guest kernel and EROFS rootfs a sandbox boots |

          **There is no Windows CLI-only archive, deliberately.** It would be a strict subset
          of `boks_*_windows_amd64.zip` — a smaller download whose only distinguishing
          property is that it cannot start a sandbox. Everything in the Windows zip sits in
          one flat directory beside `boks.exe`, which is where `boks daemon start` looks: it
          prepends that directory to the `PATH` it starts containerd with, and the shim finds
          `krun.dll`, the kernel and the rootfs by scanning that same `PATH`. So there is
          nothing to put on `PATH` and nothing to configure — as long as containerd is the one
          `boks daemon start` runs. Start the bundled `containerd.exe` yourself and you are
          back to setting `PATH` by hand.

          **macOS has no runtime archive, on purpose.** libkrun needs the
          `com.apple.security.hypervisor` entitlement, and Homebrew's source build is what
          re-signs the shim after relocating it — a pre-built binary would arrive without the
          entitlement and die inside libkrun with `krun_start_enter failed: -22`, an error
          naming neither code signing nor the entitlement. Use `brew install boks`. The
          `aarch64` guest archive above is the same file a Mac needs.

          ## Platforms — what has actually been run

          The table is the point of this project's `docs/verification.md`, and it distinguishes
          what was measured from what was assumed. It is reproduced honestly here.

          | Platform | State |
          |---|---|
          | `darwin_arm64` | **Verified.** The VM boundary and the network policy were both measured here: a Linux guest on a Darwin host, its own `boot_id`, uptime and vCPU count, and a policy that refuses a raw TLS handshake to a denied address while an allowed one completes with the origin's own certificate. |
          | `linux_amd64` | **Verified end to end on 2026-08-15**, in WSL2 on Ubuntu 26.04 — 25 of 26 checks passed, including the network boundary with its positive control. The single failure was the tester's own file ownership and was proved so. **No bare-metal Linux run is recorded.** |
          | `linux_arm64` | Builds and passes its tests. **Nothing has ever been run on it.** |
          | `windows_amd64` | **Verified end to end on 2026-08-15, unelevated.** `boks run` boots a Linux guest through the Windows Hypervisor Platform, the policy engine allows `github.com` and refuses `example.com` on real traffic, TLS completes, and `boks stop` / `boks rm` leave nothing behind. One machine, `--net nat`. |

          ## What is *not* proven

          - **No bare-metal Linux run.** The Linux verification was inside WSL2. Nothing says a
            distribution kernel with `/dev/kvm` behaves the same.
          - **`linux_arm64` has never been run** — neither the CLI nor the runtime archive.
          - **On Linux, sandbox creation still needed more privilege than an ordinary user
            had**: Boks host-mounts an overlay to read the image config, which failed with
            `operation not permitted`. Expect to hit that.
          - **The shim needs containerd 2.3 or newer, and no distribution ships one.** It emits
            version-3 bootstrap parameters; a 2.2 daemon cannot decode them and fails with
            `unsupported protocol: Yunix`, which names no version, no shim and no protocol.
            This was measured against Ubuntu's 2.2.2. `boks doctor` now warns about the skew.
          - **`windows_arm64` and Intel macOS are not shipped at all**, and cannot be: there is
            no `krun.dll` or `mkfs.erofs.exe` for aarch64 Windows, and libkrun on macOS needs
            Apple silicon.
          - **Nothing in the runtime archives was executed by CI.** The workflows compile,
            link, and read the built binaries back — architectures, exported symbols, linked
            plugins — on runners with no hypervisor. That is load-time and link-time evidence.
            The end-to-end results above were obtained on real hardware, by hand.

          ## Verifying what you downloaded

          Nothing here is code-signed: no Authenticode certificate, no Developer ID. Windows
          will show SmartScreen's "Windows protected your PC". What *is* signed is the checksum
          file, with the archive key in
          [`packaging/apt/`](https://github.com/dagsommer/boks/tree/main/packaging/apt)
          (fingerprint `D5DD07C0F9589C164F7361C20EB93D3C39471E1E`).

          ```
          curl -fsSL https://raw.githubusercontent.com/dagsommer/boks/main/packaging/apt/boks-archive-keyring.asc | gpg --import
          gpg --verify SHA256SUMS.asc SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify <file> --repo dagsommer/boks
          ```

          The attestation is the stronger of the two: it does not require trusting a key, and
          it names the workflow and the commit that produced each file.

          ## Source for the guest kernel

          The guest archives — and `boks_*_windows_amd64.zip`, which carries the guest so a
          `winget install` boots without a second download — contain a Linux kernel, which is
          GPL-2.0 and is patched by nerdbox. Every archive that contains it carries a
          `SOURCE.txt` naming the exact upstream revision and the two `docker buildx bake`
          commands that reproduce it.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "boks $VERSION" \
            --notes-file "$notes" \
            "${draft[@]}" \
            dist/*
