# Build the two host binaries that stand between Boks and containerd on native Windows, and
# publish them so the Windows tester needs no Docker, no mingw, and no Go.
#
# WHY THIS EXISTS. Boks' runtime is nerdbox, and nerdbox needs an EROFS snapshotter: its
# non-Linux mount handling (mount_other.go) understands erofs, ext4 and overlay, and forwards
# every other mount type verbatim into the guest, where it fails. containerd's Windows build
# does not register the erofs snapshotter or differ — builtins_windows.go lists only lcow and
# windows — so `ctr --snapshotter erofs` has nothing to bind to. And the erofs differ shells
# out to `mkfs.erofs`, which has no Windows package anywhere.
#
# So two binaries, and they are useless apart: without mkfs.erofs.exe on PATH the erofs differ
# returns ErrSkipPlugin at init and silently disappears from a containerd that otherwise looks
# healthy. They are built by one workflow and shipped as one bundle for that reason.
#
# Read packaging/containerd-windows/README.md and packaging/mkfs-erofs-windows/README.md before
# changing anything here. They explain the patch, the pins, what is known not to work on
# Windows, and the exact commands to test the result.
#
# WHAT THIS WORKFLOW PROVES, AND WHAT IT DOES NOT. It proves the containerd patches still apply
# to the pinned release, that the erofs plugin packages still cross-compile for Windows and are
# genuinely linked into the binary, that the diff-service default order in the built PE really
# names erofs first (read out of .data, because `strings` cannot tell that from three unrelated
# words), that the mount manager's superblock probe table in the built PE really says ext4's
# magic is 53 ef at offset 1080 (read out of .data for the same reason — a two-byte magic and a
# small integer occur by coincidence all over a 37 MB binary), that mkfs.erofs.exe carries no
# hardcoded "/tmp", and that the go-erofs recipe still produces a PE32+ binary whose help text
# advertises tar mode. It also parses new-containerd-root.ps1 — the bundled script that must be
# run before containerd, because an unelevated containerd creates its own --root with a DACL
# that excludes the user.
#
# It runs the Go tests for the diff service, the transfer plugin and the mount manager, on
# Linux, because that code is platform-neutral. Everything else is inspection.
#
# It proves NOTHING about whether the Windows binaries run. No Windows binary is executed here —
# this is a Linux runner. Registering a plugin, linking it in, and naming it in a default list
# are all necessary and none of them is sufficient; the first real Windows run needed four
# separate fixes past "the plugins load". Download the bundle and run the commands in
# packaging/containerd-windows/README.md to learn anything at all about whether it works.
name: containerd-windows

on:
  push:
    branches: [main]
    paths:
      - "packaging/containerd-windows/**"
      - "packaging/mkfs-erofs-windows/**"
      - ".github/workflows/containerd-windows.yml"
  pull_request:
    paths:
      - "packaging/containerd-windows/**"
      - "packaging/mkfs-erofs-windows/**"
      - ".github/workflows/containerd-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containerd-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------------------------
  # mkfs.erofs.exe — erofs-utils cross-compiled with mingw-w64, using erofs/go-erofs's recipe.
  #
  # `ubuntu-24.04`, pinned, NOT `ubuntu-latest`. This is load-bearing: on a newer mingw-w64
  # (Debian trixie) the build dies with `implicit declaration of function 'asprintf'`, because
  # newer headers no longer declare it under the feature-test macros erofs-utils sets. go-erofs
  # runs this on `ubuntu-latest` and gets away with it only because that label still means 24.04
  # today. Pinning the image means this breaks when we change it, not when GitHub does.
  # -----------------------------------------------------------------------------------------
  mkfs-erofs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: boks

      - name: Read the pinned go-erofs revision
        id: pin
        run: |
          set -euo pipefail
          rev="$(grep -v '^[[:space:]]*#' boks/packaging/mkfs-erofs-windows/GO_EROFS_REV | tr -d '[:space:]')"
          case "$rev" in
            [0-9a-f]*) ;;
            *) echo "GO_EROFS_REV does not contain a commit SHA: '$rev'" >&2; exit 1 ;;
          esac
          if [ "${#rev}" -ne 40 ]; then
            echo "GO_EROFS_REV must be a full 40-character SHA, got ${#rev} characters" >&2
            exit 1
          fi
          echo "rev=$rev" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: erofs/go-erofs
          ref: ${{ steps.pin.outputs.rev }}
          path: go-erofs
          fetch-depth: 0

      # The recipe's inputs are DERIVED from the pinned tree, never duplicated in this repo.
      # go-erofs owns the patch series and picks the erofs-utils it targets; a copy here would
      # be a second source of truth that rots the first time they fix a patch.
      #
      # Every derivation is asserted rather than defaulted. If upstream restructures the
      # workflow, this must fail loudly — a silently empty patch list would build an unpatched
      # erofs-utils, and the failure would surface much later as a mystery on Windows.
      - name: Derive the recipe from the pinned go-erofs tree
        id: recipe
        working-directory: go-erofs
        run: |
          set -euo pipefail
          ci=.github/workflows/ci.yml
          test -f "$ci" || { echo "$ci is gone — upstream restructured, re-read the recipe" >&2; exit 1; }

          grep -q 'cross-compile-mkfs-windows:' "$ci" \
            || { echo "job 'cross-compile-mkfs-windows' is gone from $ci" >&2; exit 1; }

          erofs="$(grep -oP '^\s*EROFS_UTILS_VERSION:\s*\K\S+' "$ci" | head -1)"
          test -n "$erofs" || { echo "EROFS_UTILS_VERSION not found in $ci" >&2; exit 1; }

          # [0-9]+(\.[0-9]+)+ and not [0-9.]+ — the latter also eats the dot of `.tar.gz`
          # and yields "1.10.0.", which 404s at the download step much later on.
          lz4="$(grep -oP 'lz4/archive/refs/tags/v\K[0-9]+(\.[0-9]+)+' "$ci" | head -1)"
          test -n "$lz4" || { echo "lz4 version not found in $ci" >&2; exit 1; }

          n_patches=$(find .github/workflows/patches/erofs-utils -name '*.patch' | wc -l)
          test "$n_patches" -gt 0 || { echo "no erofs-utils patches found" >&2; exit 1; }

          n_headers=$(find .github/workflows/mingw-compat-headers -type f | wc -l)
          test "$n_headers" -gt 0 || { echo "no mingw compat headers found" >&2; exit 1; }

          echo "erofs-utils $erofs, lz4 $lz4, $n_patches patches, $n_headers compat headers"
          {
            echo "erofs=$erofs"
            echo "lz4=$lz4"
            echo "patches=$n_patches"
          } >>"$GITHUB_OUTPUT"

      - name: Install the mingw-w64 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config mingw-w64 make curl ca-certificates patch file
          x86_64-w64-mingw32-gcc --version | head -1

      # Static lz4. --enable-lz4 is the one compressor kept: EROFS layers containerd produces
      # use it, and it cross-compiles cleanly. zlib, lzma and zstd are all configured out.
      - name: Cross-compile lz4 for Windows
        env:
          MINGW_HOST: x86_64-w64-mingw32
          LZ4_VERSION: ${{ steps.recipe.outputs.lz4 }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/lz4/lz4/archive/refs/tags/v${LZ4_VERSION}.tar.gz" | tar -xzf -
          cd "lz4-${LZ4_VERSION}/lib"
          make -j"$(nproc)" \
            CC=${MINGW_HOST}-gcc AR=${MINGW_HOST}-ar WINDRES=${MINGW_HOST}-windres \
            TARGET_OS=Windows BUILD_STATIC=yes BUILD_SHARED=no \
            CFLAGS="-O3 -DXXH_NAMESPACE=LZ4_"
          sudo make PREFIX=/usr/${MINGW_HOST} install

      # The patches are SEQUENTIAL. 003-windows-pipe-lseek.patch does not apply to a pristine
      # tree — it depends on 001. Hence the sorted loop and no --dry-run pre-flight.
      - name: Cross-compile erofs-utils for Windows
        env:
          MINGW_HOST: x86_64-w64-mingw32
          EROFS_UTILS_VERSION: ${{ steps.recipe.outputs.erofs }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/erofs/erofs-utils/archive/refs/tags/${EROFS_UTILS_VERSION}.tar.gz" | tar -xzf -
          cd "erofs-utils-${EROFS_UTILS_VERSION#v}"

          sudo cp -r "${GITHUB_WORKSPACE}/go-erofs/.github/workflows/mingw-compat-headers"/* \
            /usr/${MINGW_HOST}/include/

          for p in $(find "${GITHUB_WORKSPACE}/go-erofs/.github/workflows/patches/erofs-utils" -name '*.patch' | sort); do
            echo "::group::$(basename "$p")"
            patch -p1 <"$p"
            echo "::endgroup::"
          done

          # Then Boks' own patches, on top, in the same order. These are ours because
          # nobody upstream has a Windows mkfs.erofs to be bothered by them yet — see
          # packaging/mkfs-erofs-windows/README.md for why each one exists and where it
          # is meant to end up. They are generated against the go-erofs-patched tree, so
          # they must come after that loop, and no fuzz: if the pin moves and a hunk
          # drifts, that must fail here rather than silently on a Windows desktop.
          shopt -s nullglob
          boks_patches=("${GITHUB_WORKSPACE}/boks/packaging/mkfs-erofs-windows/patches"/*.patch)
          if [ ${#boks_patches[@]} -eq 0 ]; then
            echo "no patches in packaging/mkfs-erofs-windows/patches/ — the C:\\tmp fix is missing" >&2
            exit 1
          fi
          for p in "${boks_patches[@]}"; do
            echo "::group::boks $(basename "$p")"
            patch -p1 --no-backup-if-mismatch -F0 <"$p"
            echo "::endgroup::"
          done

          ./autogen.sh
          PKG_CONFIG_PATH=/usr/${MINGW_HOST}/lib/pkgconfig \
          ./configure \
            --host=${MINGW_HOST} --disable-shared --enable-lz4 \
            --without-zlib --disable-lzma --without-libzstd --without-selinux \
            --without-uuid --without-openssl --disable-fuse --disable-debug \
            --disable-dependency-tracking \
            CFLAGS="-O2 -g -D_FILE_OFFSET_BITS=64" \
            LDFLAGS="-Wl,-Bstatic -static-libgcc -L/usr/${MINGW_HOST}/lib" \
            liblz4_LIBS="/usr/${MINGW_HOST}/lib/liblz4.a"

          make -j"$(nproc)" -C lib  CPPFLAGS="-include posix_compat.h"
          make -j"$(nproc)" -C mkfs CPPFLAGS="-include posix_compat.h" LIBS="-llz4"
          ${MINGW_HOST}-strip mkfs/mkfs.erofs.exe

          mkdir -p "${GITHUB_WORKSPACE}/out"
          cp mkfs/mkfs.erofs.exe "${GITHUB_WORKSPACE}/out/"

      # Two assertions, both earned.
      #
      # PE32+: a cross-build that silently fell back to the host compiler would produce a
      # working-looking ELF named .exe, and nothing downstream would notice until Windows
      # refused to load it.
      #
      # --tar=: containerd's differ decides whether to register itself by running
      # `mkfs.erofs --help` and grepping the output for exactly this literal. A build that
      # dropped tar support would produce a perfectly good mkfs.erofs.exe that makes the erofs
      # differ vanish at init with no error anyone would connect to this job.
      #
      # No "/tmp", and the two Win32 temp-path imports: the shipped v1.9.1 hardcodes a
      # "/tmp" fallback that mingw's CRT turns into C:\tmp, and mkfs.erofs.exe then refuses
      # to run on any machine that does not happen to have that directory — reporting "no
      # space left on device" while it does so. These two checks are how we know
      # packaging/mkfs-erofs-windows/patches/ actually reached this binary, since the
      # symptom is invisible until someone runs it on Windows.
      - name: Assert mkfs.erofs.exe is a PE32+ binary that supports tar mode
        run: |
          set -euo pipefail
          f=out/mkfs.erofs.exe
          magic="$(head -c 2 "$f")"
          [ "$magic" = "MZ" ] || { echo "$f is not a PE image (magic '$magic')" >&2; exit 1; }
          objdump -f "$f" | grep -q 'pei-x86-64' \
            || { echo "$f is not PE32+ x86-64" >&2; objdump -f "$f" >&2; exit 1; }
          strings "$f" | grep -q -- '--tar=' \
            || { echo "$f help text has no '--tar=' — containerd's differ would skip itself" >&2; exit 1; }
          if strings "$f" | grep -qx '/tmp'; then
            echo "$f still contains the hardcoded '/tmp' temp path — it will need C:\\tmp to exist" >&2
            exit 1
          fi
          for sym in GetTempPathW GetTempFileNameW; do
            objdump -p "$f" | grep -qi "$sym" \
              || { echo "$f does not import $sym — the temp-path patch did not take" >&2; exit 1; }
          done
          echo "  PE32+ x86-64, $(wc -c <"$f") bytes, advertises --tar=, no '/tmp', imports GetTempPathW"
          objdump -p "$f" | grep -i 'DLL Name'

      - uses: actions/upload-artifact@v4
        with:
          name: mkfs-erofs-windows-amd64
          path: out/mkfs.erofs.exe
          if-no-files-found: error

      - name: Record what was built
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## mkfs.erofs.exe"
            echo
            echo "erofs-utils \`${{ steps.recipe.outputs.erofs }}\`, lz4 \`${{ steps.recipe.outputs.lz4 }}\`,"
            echo "${{ steps.recipe.outputs.patches }} patches from erofs/go-erofs \`${{ steps.pin.outputs.rev }}\`."
            echo
            echo '```'
            sha256sum out/mkfs.erofs.exe 2>/dev/null | sed 's|out/||' || echo "(build failed)"
            echo '```'
            echo
            echo "x86-64 only — go-erofs's recipe cross-compiles for no other Windows target."
            echo "This binary has never been executed, on Windows or anywhere."
          } >>"$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------------------------
  # containerd.exe + ctr.exe, with the erofs snapshotter and differ registered on Windows.
  #
  # ubuntu-latest is fine here: CGO_ENABLED=0, so Go cross-compiles to Windows with no C
  # toolchain and produces exactly the PE a Windows runner would.
  # -----------------------------------------------------------------------------------------
  containerd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: boks

      - name: Read the pinned containerd version
        id: pin
        run: |
          set -euo pipefail
          ver="$(grep -v '^[[:space:]]*#' boks/packaging/containerd-windows/CONTAINERD_VERSION | tr -d '[:space:]')"
          case "$ver" in
            v[0-9]*) ;;
            *) echo "CONTAINERD_VERSION must be a vX.Y.Z tag, got '$ver'" >&2; exit 1 ;;
          esac
          echo "ver=$ver" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: containerd/containerd
          ref: ${{ steps.pin.outputs.ver }}
          path: containerd
          fetch-depth: 0

      # `git apply`, not `git am`: `am` writes a commit and needs a committer identity the
      # runner does not have. No --3way and no fuzz — the version is pinned, so the patch
      # applies exactly or the pin and the patch have drifted, and fuzzing would hide it.
      - name: Apply the Boks erofs-on-Windows patch
        working-directory: containerd
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(../boks/packaging/containerd-windows/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches found — packaging/containerd-windows/patches/ is empty" >&2
            exit 1
          fi
          git apply --verbose "${patches[@]}"

      # containerd's own go directive, so the toolchain moves with the pin.
      - uses: actions/setup-go@v6
        with:
          go-version-file: containerd/go.mod
          cache: false

      - name: Record the toolchain
        run: go version

      # amd64 is what ships in the bundle, because mkfs.erofs.exe exists only for x86-64 and
      # without it the differ skips itself. arm64 is built anyway, and only to catch a
      # compile-time break: the erofs packages' !linux fallbacks carry no architecture
      # condition, so an arm64-only regression would otherwise go unseen.
      - name: Build containerd and ctr for Windows
        working-directory: containerd
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ver="${{ steps.pin.outputs.ver }}"
          rev="$(git rev-parse HEAD)"
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/containerd/containerd/v2/version.Version=${ver#v}+boks-erofs"
          ldflags="$ldflags -X github.com/containerd/containerd/v2/version.Revision=${rev}"
          for arch in amd64 arm64; do
            echo "::group::GOOS=windows GOARCH=$arch"
            for cmd in containerd ctr; do
              GOOS=windows GOARCH="$arch" go build -mod=readonly -ldflags "$ldflags" \
                -o "_out/$arch/$cmd.exe" "./cmd/$cmd"
            done
            echo "::endgroup::"
          done
          ls -lR _out/

      - name: Assert the artifacts are PE executables with the erofs plugins linked in
        working-directory: containerd
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            for cmd in containerd ctr; do
              f="_out/$arch/$cmd.exe"
              magic="$(head -c 2 "$f")"
              [ "$magic" = "MZ" ] || { echo "$f is not a PE image (magic '$magic')" >&2; exit 1; }
              echo "  $f: PE, $(wc -c <"$f") bytes"
            done
          done

          # The point of the whole patch. `go build` cannot fail if an underscore import is
          # missing — it just builds a containerd without the plugin, exactly like upstream's.
          # Assert both packages are actually in the binary.
          for pkg in plugins/diff/erofs/plugin plugins/snapshots/erofs/plugin; do
            for arch in amd64 arm64; do
              strings "_out/$arch/containerd.exe" | grep -q "containerd/v2/$pkg" \
                || { echo "$pkg is NOT linked into containerd.exe ($arch)" >&2; exit 1; }
            done
            echo "  linked: $pkg"
          done

          # And that the patch did not displace what Windows already had.
          strings _out/amd64/containerd.exe | grep -q 'plugins/snapshots/windows' \
            || { echo "the windows snapshotter went missing" >&2; exit 1; }
          echo "  linked: plugins/snapshots/windows (unchanged)"

      # Linking the differ in is not the same as the diff service consulting it, and the
      # difference is invisible to `strings`: 'erofs', 'windows' and 'windows-lcow' all
      # appear in an unpatched binary as unrelated strings. This reads the actual slice
      # out of .data. See the script's docstring for how, and for what it does not prove.
      - name: Assert the diff-service default order actually names erofs
        working-directory: containerd
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            python3 ../boks/packaging/containerd-windows/assert-diff-order.py \
              "_out/$arch/containerd.exe" erofs windows windows-lcow
          done

      # Patch 0005 turns "the image file exists" into "the image file has this filesystem's
      # superblock magic". The table it reads that from is static data, so it can be read
      # back out of the PE the same way the diff order is — and unlike the diff order, the
      # values are a two-byte magic and a small integer, which `strings` could not
      # distinguish from noise even in principle. An unpatched build of the same tree has no
      # such table and fails this check.
      - name: Assert the mkfs transformer carries the superblock probe table
        working-directory: containerd
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            python3 ../boks/packaging/containerd-windows/assert-mkfs-magic.py \
              "_out/$arch/containerd.exe" \
              ext2:1080:53ef ext3:1080:53ef ext4:1080:53ef xfs:0:58465342
          done

      # The only claims in this whole workflow that are checked by running something rather
      # than by looking at bytes. Dropping a skipped differ from the order is what keeps a
      # host with no mkfs.erofs.exe from losing its diff service — and with it bolt, and
      # every service that depends on bolt — now that erofs is a default order entry. The
      # mount-manager tests are where patch 0005 is actually exercised: the probe table
      # asserted above only says what the binary believes, and one of these tests formats an
      # image with the real mkfs.ext4 and feeds it back in, so the constants are checked
      # against what the formatter writes rather than against themselves.
      #
      # The cmd/ctr tests are patch 0004's `windows` section. They are runnable here — and
      # only here — because withoutWindowsSection was deliberately put in a file with no
      # build constraint: the spec it repairs is written by a Windows host and read by a
      # Linux guest, so neither end is this runner, and the test builds the Windows host's
      # spec by hand rather than asking the host it runs on. One of them asserts that the
      # empty section marshals as `"windows":{"layerFolders":null}` — the exact text crun
      # refused on real hardware — which is what makes the other one's removal mean
      # something.
      - name: Run the diff-service, transfer plugin, mount-manager and ctr spec tests
        working-directory: containerd
        run: |
          set -euo pipefail
          go test ./plugins/services/diff/... ./plugins/transfer/... ./core/mount/manager/... -count=1
          # Named individually, and their PASS lines checked, because `go test -run` on a
          # pattern that matches nothing exits 0. A renamed or deleted test would otherwise
          # turn this assertion off without turning the workflow red.
          go test ./cmd/ctr/commands/run/... -run WindowsSection -count=1 -v | tee ctr-spec.log
          for t in TestAnEmptyWindowsSectionMarshalsAsTheFieldCrunRejects \
                   TestWithoutWindowsSectionRemovesIt \
                   TestWithoutWindowsSectionIsANoOpWhenThereIsNoSection; do
            grep -q -- "--- PASS: $t" ctr-spec.log \
              || { echo "$t did not run — patch 0004's windows-section fix is unasserted" >&2; exit 1; }
          done
          # The Windows-only assertions cannot run here, but they can at least be
          # type-checked, so a rename in the patched code fails in CI and not on a desktop.
          # cmd/ctr is in the list for patch 0004, most of whose diff is in a _windows.go
          # file: `go build ./cmd/ctr` for Linux does not compile a line of it.
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet \
            ./plugins/services/diff/... ./plugins/transfer/... ./core/mount/... ./cmd/ctr/...

      # Two import lines cannot plausibly break Linux, which is exactly why it costs nothing
      # to assert instead of assume.
      - name: Build for Linux too, so the platform that works stays working
        working-directory: containerd
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 go build -mod=readonly ./cmd/containerd ./cmd/ctr

      - uses: actions/upload-artifact@v4
        with:
          name: containerd-windows
          path: containerd/_out/**/*.exe
          if-no-files-found: error

      - name: Record what was built
        if: always()
        working-directory: containerd
        run: |
          set -uo pipefail
          {
            echo "## containerd.exe + ctr.exe"
            echo
            echo "containerd \`${{ steps.pin.outputs.ver }}\` + \`packaging/containerd-windows/patches/\`,"
            echo "reporting version \`${{ steps.pin.outputs.ver }}+boks-erofs\`."
            echo
            echo '```'
            (cd _out && sha256sum */*.exe) 2>/dev/null || echo "(build failed)"
            echo '```'
            echo
            echo "The erofs snapshotter and differ are linked in, for both architectures."
            echo "Only amd64 is usable: mkfs.erofs.exe exists for x86-64 only, and without it"
            echo "the erofs differ returns ErrSkipPlugin at init and disappears."
          } >>"$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------------------------
  # One artifact the tester downloads once. The three binaries are useless apart, and asking
  # someone to collect them from two artifacts and get them into one directory on PATH is how
  # you end up debugging a missing erofs differ instead of testing containerd.
  # -----------------------------------------------------------------------------------------
  bundle:
    runs-on: ubuntu-latest
    needs: [mkfs-erofs, containerd]
    steps:
      - uses: actions/checkout@v5
        with:
          path: boks

      # The one thing about new-containerd-root.ps1 that can be checked without Windows.
      # It is shipped to a tester who will run it as the very first command of a session,
      # and a typo in it would look exactly like the ACL bug it exists to prevent. `pwsh`
      # is preinstalled on GitHub's ubuntu images; the parser is the same one Windows
      # PowerShell 7 uses, and it is the only part of the script that is platform-neutral
      # (WindowsIdentity and icacls.exe are not, so this parses rather than executes).
      - name: Parse new-containerd-root.ps1
        shell: pwsh
        run: |
          $errs = $null
          $tokens = $null
          $script = 'boks/packaging/containerd-windows/new-containerd-root.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs) {
            $errs | ForEach-Object { Write-Host "::error file=$script,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Host "  $script parses clean ($($tokens.Count) tokens)"

      - uses: actions/download-artifact@v4
        with:
          name: mkfs-erofs-windows-amd64
          path: staging

      - uses: actions/download-artifact@v4
        with:
          name: containerd-windows
          path: containerd-artifact

      - name: Assemble the amd64 test bundle
        run: |
          set -euo pipefail
          cp containerd-artifact/amd64/containerd.exe staging/
          cp containerd-artifact/amd64/ctr.exe staging/
          cp boks/packaging/containerd-windows/README.md staging/README.md
          # config.toml is not a convenience. Without its disabled_plugins the cimfs
          # snapshotter fails unelevated and takes bolt and ~40 plugins with it, and
          # without its root/state a normal user cannot create C:\ProgramData\containerd
          # at all. Shipping it is the difference between the README's steps working and
          # the tester rediscovering both.
          cp boks/packaging/containerd-windows/config.toml staging/config.toml
          # Not a convenience either. Without pre-created root/state directories, an
          # unelevated containerd creates them with a DACL naming only Administrators and
          # SYSTEM, then cannot write inside its own root — 43 plugins down, behind an
          # error that names the content store rather than a permission. See the README
          # section "The root directory must exist first".
          cp boks/packaging/containerd-windows/new-containerd-root.ps1 staging/
          ls -l staging/

      # The writable layer, formatted here because Windows cannot format it.
      #
      # On non-Linux the erofs snapshotter defaults to block mode
      # (plugins/snapshots/erofs/erofs_other.go: defaultWritableSize = 64 MiB, and
      # erofs.go:187 sets blockMode = defaultSize > 0), so an active snapshot's first
      # mount is `mkfs/ext4` with `X-containerd.mkfs.size=67108864`. containerd's mount
      # manager handles that type itself -- nerdbox's runtime-allow-mounts covers only
      # `mkdir/*,format/*,erofs` -- by exec'ing `mkfs.ext4`, which does not exist on
      # Windows in any packaged form. nerdbox's own README tells macOS users to brew
      # install e2fsprogs for exactly this.
      #
      # core/mount/manager/mkfs.go skips formatting when the target file already carries the
      # filesystem's superblock magic, so a correct image dropped in beforehand is all that
      # is needed. Before patch 0005 it skipped formatting whenever the file merely existed,
      # which is why the ext4 magic is asserted here and not just the byte count: this image
      # is the one file in the bundle that has to be genuinely formatted, and a truncate
      # without a mkfs would have been accepted by the old code and by nothing else.
      # 64 MiB of mostly zeros; the artifact zip takes it to well under 100 KB.
      - name: Format the writable-layer image Windows cannot make for itself
        run: |
          set -euo pipefail
          command -v mkfs.ext4 >/dev/null \
            || { echo "mkfs.ext4 is missing on this runner" >&2; exit 1; }
          truncate -s 64M staging/rwlayer-64m.img
          mkfs.ext4 -q staging/rwlayer-64m.img
          file staging/rwlayer-64m.img | grep -q 'ext4 filesystem' \
            || { echo "not an ext4 image" >&2; file staging/rwlayer-64m.img >&2; exit 1; }
          [ "$(wc -c <staging/rwlayer-64m.img)" -eq 67108864 ] \
            || { echo "image is not exactly 64 MiB, which is the size the snapshotter asks for" >&2; exit 1; }
          # The exact bytes patch 0005 makes containerd look for: EXT2_SUPER_MAGIC, a __le16
          # at offset 0x38 of a superblock that starts 1024 bytes in, so 1080 absolute.
          magic="$(dd if=staging/rwlayer-64m.img bs=1 skip=1080 count=2 status=none | od -An -tx1 | tr -d ' \n')"
          [ "$magic" = "53ef" ] \
            || { echo "no ext4 superblock magic at offset 1080 — containerd will refuse this image" >&2; exit 1; }
          echo "  rwlayer-64m.img: $(file -b staging/rwlayer-64m.img), magic 53 ef at 1080"

      - uses: actions/upload-artifact@v4
        with:
          name: containerd-windows-amd64-bundle
          path: staging/*
          if-no-files-found: error
          retention-days: 30

      - name: Checksums and how to test
        run: |
          set -euo pipefail
          {
            echo "## Windows test bundle (amd64)"
            echo
            echo "Artifact \`containerd-windows-amd64-bundle\` — three binaries, a \`config.toml\`,"
            echo "\`new-containerd-root.ps1\`, a pre-formatted \`rwlayer-64m.img\` and the README."
            echo
            echo '```'
            (cd staging && sha256sum ./*.exe | sed 's|\./||')
            echo '```'
            echo
            echo "Unzip all of it into one directory and put that directory on \`PATH\` **before**"
            echo "starting containerd. \`mkfs.erofs.exe\` must be resolvable when containerd"
            echo "initialises, or the erofs differ returns \`ErrSkipPlugin\` and vanishes with no"
            echo "error that mentions it."
            echo
            echo "**These steps run unelevated. Creating a *task* does not.** containerd's"
            echo "\`NewBundle\` symlinks unconditionally (\`core/runtime/v2/bundle.go:103\`) and"
            echo "unprivileged Windows will not create a symlink without Developer Mode, so"
            echo "\`ctr run\` needs an elevated daemon or a machine-wide Developer Mode. Nothing"
            echo "below reaches that — it unpacks an image and stops. If you do run elevated,"
            echo "give the daemon a **fresh \`--root\` it creates itself**: an elevated daemon"
            echo "pointed at a root an unprivileged user made hands that user its content"
            echo "store. See \`README.md\` in the artifact."
            echo
            echo "**Run unelevated, pass \`--config\`, and create \`root\`/\`state\` first.** The"
            echo "defaults fail three ways over: a normal user cannot create"
            echo "\`C:\\ProgramData\\containerd\`; the cimfs snapshotter cannot initialise without"
            echo "privileges — which fails bolt, which fails roughly forty plugins including the"
            echo "erofs differ; and any root directory containerd creates for itself unelevated"
            echo "gets a protected DACL naming only Administrators and SYSTEM, which locks the"
            echo "daemon out of its own content store. The shipped \`config.toml\` moves the state"
            echo "to \`C:\\cdtest\`, uses a private pipe and disables cimfs;"
            echo "\`new-containerd-root.ps1\` handles the directories."
            echo
            echo "Then, in order — full commands and what each proves are in \`README.md\` in the"
            echo "artifact:"
            echo
            echo '```powershell'
            echo '.\new-containerd-root.ps1            # root+state must exist before containerd'
            echo 'mkfs.erofs -V                        # the exe runs at all'
            echo 'containerd.exe --config .\config.toml --log-level debug   # own console'
            echo '$env:CONTAINERD_ADDRESS = ''\\.\pipe\boks-containerd'''
            echo 'ctr.exe plugins ls | Select-String erofs   # both plugins must say ok, not skip'
            echo 'ctr.exe -n test images pull --platform linux/amd64 --snapshotter erofs docker.io/library/alpine:latest'
            echo '```'
            echo
            echo "**No Windows binary here has been run.** Everything was cross-compiled and"
            echo "inspected on a Linux runner. \`ctr plugins ls\` saying \`ok\` is a weak signal by"
            echo "construction — it means a plugin initialised, not that anything calls it — so"
            echo "the pull, not the plugin table, is what answers the question."
          } >>"$GITHUB_STEP_SUMMARY"
