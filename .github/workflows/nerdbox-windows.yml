# Build nerdbox's shim for Windows with our patches applied, against a pinned upstream tree.
#
# Boks' container runtime is nerdbox, and its shim compiles for Windows today but cannot start
# there: containerd's pkg/shim stubs six process-lifecycle functions with ErrNotImplemented,
# and run() hits the first of them — setupSignals, at pkg/shim/shim.go:228 — before it looks at
# the action argument. `packaging/nerdbox-windows/` holds the patches that get past that; this
# workflow is what stops them from rotting. Read that README first — it explains what the
# patches are, which one is an unmerged third-party pull request, and why they live here.
#
# The pin is `packaging/nerdbox/NERDBOX_REV`, shared with guest-image.yml rather than
# duplicated. The guest kernel, the rootfs, and the shim that boots them have to come from one
# nerdbox commit, and a SHA in two files eventually disagrees with itself.
#
# ubuntu-latest, not windows-latest — unlike the libkrun series, which needs MSVC and a native
# runner. Go cross-compiles to windows/amd64 and windows/arm64 with no C toolchain involved
# (nerdbox's shim is pure Go on Windows; the cgo paths are Linux-only), so a Linux runner
# produces exactly the same PE a Windows runner would, faster and cheaper. If a future patch
# introduces cgo on the Windows path, this assumption dies and the runner has to change.
#
# WHAT THIS JOB PROVES, AND WHAT IT DOES NOT. It proves the patch series still applies to the
# pinned revision and still compiles into a PE executable for both Windows architectures. That
# is enough to stop a merge that breaks the series or drifts the pin.
#
# It proves NOTHING about whether the shim runs. The patched shim HAS been started on Windows —
# on 2026-08-14 it served ttrpc under a real containerd and ran a container in a microVM (see
# docs/verification.md) — but not by this job, which has no Windows runner and no hypervisor.
# The bug this whole directory exists to fix was invisible to a compiler, the unpatched shim
# built perfectly and died at runtime in 118 ms, and the 30-second teardown stall that patch
# 0005 fixes was found by running rather than by building. A green run here is precisely the
# kind of evidence that has now failed to catch the problem twice. Compiling a shim is not
# starting one.
#
# Triggers: only a change to the patches, the pin, or this file. Plus workflow_dispatch, for
# when you want to know whether the series still applies to a nerdbox that has moved, and
# workflow_call, so release.yml builds the shim at the tag rather than fetching one built from
# some other commit. A `paths:` filter constrains only the event it is written under, so it
# does not reach workflow_call.
name: nerdbox-windows

on:
  push:
    branches: [main]
    paths:
      - "packaging/nerdbox-windows/**"
      - "packaging/nerdbox/NERDBOX_REV"
      - ".github/workflows/nerdbox-windows.yml"
  pull_request:
    paths:
      - "packaging/nerdbox-windows/**"
      - "packaging/nerdbox/NERDBOX_REV"
      - ".github/workflows/nerdbox-windows.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# `github.workflow` is the CALLER's workflow name under workflow_call, which keeps a release
# build and a direct run on the same ref out of one another's group. With `cancel-in-progress`
# on, sharing one would let a push to `main` cancel a release.
concurrency:
  group: ${{ github.workflow }}-nerdbox-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: boks

      - name: Read the pinned nerdbox revision
        id: pin
        run: |
          set -euo pipefail
          # Comments and blank lines stripped; the SHA is the one remaining line.
          rev="$(grep -v '^[[:space:]]*#' boks/packaging/nerdbox/NERDBOX_REV | tr -d '[:space:]')"
          case "$rev" in
            [0-9a-f]*) ;;
            *) echo "NERDBOX_REV does not contain a commit SHA: '$rev'" >&2; exit 1 ;;
          esac
          if [ "${#rev}" -ne 40 ]; then
            echo "NERDBOX_REV must be a full 40-character SHA, got ${#rev} characters" >&2
            exit 1
          fi
          echo "rev=$rev" >>"$GITHUB_OUTPUT"

      # `fetch-depth: 0` because a pinned SHA is not necessarily reachable from the default
      # branch tip that a shallow clone would fetch.
      - uses: actions/checkout@v5
        with:
          repository: containerd/nerdbox
          ref: ${{ steps.pin.outputs.rev }}
          path: nerdbox
          fetch-depth: 0

      # `git apply`, not `git am`: `am` writes commits, and writing a commit needs a committer
      # identity that a runner does not have — it fails with "empty ident name" before it ever
      # looks at the patch. Nothing here needs the history, only the tree.
      #
      # No `--3way` and no fuzz. The revision is pinned, so the patches either apply exactly or
      # the pin and the series have drifted apart, and a fuzzy application would hide precisely
      # the breakage this job exists to find.
      - name: Apply the Boks Windows patches
        working-directory: nerdbox
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(../boks/packaging/nerdbox-windows/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches found — packaging/nerdbox-windows/patches/ is empty" >&2
            exit 1
          fi
          echo "Applying ${#patches[@]} patch(es) onto ${{ steps.pin.outputs.rev }}"
          git apply --verbose "${patches[@]}"

      # Read nerdbox's own go directive rather than pinning a version here. A shim built with a
      # different Go than nerdbox expects is a variable we do not need, and `go-version-file`
      # makes the pin move with the pin.
      - uses: actions/setup-go@v6
        with:
          go-version-file: nerdbox/go.mod
          cache: false

      - name: Record the toolchain
        run: go version

      # ---------------------------------------------------------------------------------
      # The build. REQUIRED — if the series stops compiling, that is a regression and it
      # should stop the merge.
      #
      # Both architectures: Boks targets windows/amd64 and windows/arm64, and patch 0002
      # touches a file guarded by `//go:build windows` with no architecture condition, so an
      # arm64-only break would otherwise go unseen.
      #
      # `-mod=vendor` is explicit rather than inferred. Patch 0001 edits a file under vendor/,
      # and if the build ever silently switched to the module cache it would compile the
      # UNPATCHED containerd and go green while proving nothing at all.
      # ---------------------------------------------------------------------------------
      - name: Build the shim for Windows
        working-directory: nerdbox
        env:
          GOFLAGS: -mod=vendor
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "::group::GOOS=windows GOARCH=$arch"
            GOOS=windows GOARCH="$arch" go build \
              -o "_out/containerd-shim-nerdbox-v1-$arch.exe" \
              ./cmd/containerd-shim-nerdbox-v1
            echo "::endgroup::"
          done
          ls -l _out/

      # `go build -o foo.exe` will happily produce a Linux ELF if GOOS leaks or is overridden,
      # and the filename would not tell you — hence a format check. But "MZ" alone, which is
      # all this step read until 2026-08-16, is the same two bytes for both architectures: a
      # build loop with a hardcoded GOARCH ships the amd64 shim under the arm64 name and this
      # step passes it. Demonstrated by copying one binary to both names, whereupon both
      # assertions reported PE and the job went green.
      #
      # So the COFF Machine field is read too, per architecture, the way
      # containerd-windows.yml already reads it for mkfs.erofs.exe with
      # `objdump -f | grep pei-x86-64` — except through assert-pe.py, which needs no binutils
      # and covers windows/arm64, a target objdump on the runner cannot name.
      - name: Assert the artifacts are PE executables of the architecture they claim
        working-directory: nerdbox
        run: |
          set -euo pipefail
          A=../boks/packaging/windows/assert-pe.py
          for pair in amd64:x86-64 arm64:arm64; do
            arch="${pair%%:*}"
            machine="${pair##*:}"
            f="_out/containerd-shim-nerdbox-v1-$arch.exe"
            python3 "$A" "$f" --machine "$machine" --kind exe
            echo "  $f: $(wc -c <"$f") bytes"
          done

      # The control for the step above. `--machine` is only evidence if it can reject: the
      # amd64 artifact must be refused when asked to be arm64, and the arm64 one when asked
      # to be x86-64 — which is precisely the mix-up a hardcoded GOARCH produces. Exit
      # status EXACTLY 1: assert-pe.py exits 2 for an unreadable file or a usage error, so
      # accepting any non-zero status would let a mistyped path pass both controls.
      - name: Prove the architecture assertion can fail
        working-directory: nerdbox
        run: |
          set -euo pipefail
          A=../boks/packaging/windows/assert-pe.py
          for pair in amd64:arm64 arm64:x86-64; do
            arch="${pair%%:*}"
            wrong="${pair##*:}"
            f="_out/containerd-shim-nerdbox-v1-$arch.exe"
            set +e
            python3 "$A" "$f" --machine "$wrong" >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 1 ]; then
              echo "CONTROL FAILED: $f as $wrong — expected exit 1 (ran and rejected), got $rc" >&2
              exit 1
            fi
            echo "  rejected, as it must: the $arch shim is not $wrong"
          done

      # `go build` never compiles a _test.go file, and patch 0005 adds one that only exists on
      # Windows (io_copystreams_windows_test.go). Without this step a broken Windows-only test
      # would go green here and fail for the first time on someone's Windows machine, which is
      # the audience least able to debug it. `go vet` type-checks test files, so it catches
      # that without needing a Windows runner. It cannot run them — that still needs Windows.
      - name: Vet the patched packages for Windows, including their tests
        working-directory: nerdbox
        env:
          GOFLAGS: -mod=vendor
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "::group::GOOS=windows GOARCH=$arch go vet ./internal/..."
            GOOS=windows GOARCH="$arch" go vet ./internal/...
            echo "::endgroup::"
          done

      # The patched shim must not fix Windows by breaking Linux. Patch 0002 changes a
      # `//go:build windows` file, so this should be free — which is exactly why it is cheap
      # to assert rather than assume.
      - name: Build for Linux too, so the platform that works stays working
        working-directory: nerdbox
        env:
          GOFLAGS: -mod=vendor
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 go build ./...

      # SHA256SUMS travels inside the artifact because release.yml checks it on the far side
      # of the artifact transport, before laying the amd64 shim into a release archive. A file
      # that arrives truncated is perfectly plausible right up until a machine runs it.
      - name: Checksums
        working-directory: nerdbox/_out
        run: |
          set -euo pipefail
          # Redirect rather than `| tee` into the directory the glob covers: in a pipeline the
          # shell may create the output file before the glob is expanded, and SHA256SUMS would
          # then list itself as empty.
          sha256sum -- *.exe >SHA256SUMS
          cat SHA256SUMS

      # Uploaded so someone with a Windows machine can test the thing this job cannot: whether
      # it starts. packaging/nerdbox-windows/README.md has the commands and what to look for.
      - name: Upload the shim binaries
        uses: actions/upload-artifact@v4
        with:
          name: containerd-shim-nerdbox-v1-windows
          path: nerdbox/_out/*
          if-no-files-found: error

      - name: Record what was built
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## nerdbox shim for Windows"
            echo
            echo "nerdbox \`${{ steps.pin.outputs.rev }}\` + \`packaging/nerdbox-windows/patches/\`."
            echo
            echo "The series applies and builds a PE executable for windows/amd64 and windows/arm64,"
            echo "and its Windows-only test files type-check."
            echo
            echo "**This is compile-time evidence only, and a green run here means very little.**"
            echo "The unpatched shim compiled cleanly too and died at runtime in 118 ms. A patched"
            echo "one has since run a container on Windows 11 (2026-08-14, docs/verification.md),"
            echo "and the run found a 30-second teardown stall that every build before it had"
            echo "passed. Download the artifact and run the commands in"
            echo "\`packaging/nerdbox-windows/README.md\` to learn anything about whether it works."
          } >>"$GITHUB_STEP_SUMMARY"
