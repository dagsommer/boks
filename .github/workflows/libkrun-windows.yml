# Compile-check our Windows patches for libkrun against a pinned upstream tree.
#
# Boks' VMM is libkrun, and libkrun does not build for Windows yet. `packaging/libkrun-windows/`
# holds the patches that move that wall; this workflow is what stops them from rotting. It
# checks out `containers/libkrun` at the pinned revision, applies the series, and compiles it
# for `x86_64-pc-windows-msvc`. Read packaging/libkrun-windows/README.md first — it explains
# what the patches are and why they exist here rather than upstream.
#
# Native `windows-latest`, not a cross-compile from Linux. That is not a preference, it is a
# correctness requirement: several crates in the dependency graph run `cc` from a build script
# (`bzip2-sys`, `zstd-sys`), and cross-checking from Linux fails them for want of `cl.exe` —
# an artifact of the checking host that says nothing about Windows. A native runner has the
# MSVC toolchain and reports the portability errors we actually care about.
#
# THE POINT OF THE TWO JOBS. `supported` compiles the crates that already build for Windows
# and must keep building — it is a required check, and it is the whole reason this workflow
# earns its runtime. `remaining` compiles the ones that do not yet, and is allowed to fail;
# it exists to show the wall moving. Moving a crate from `remaining` to `supported` is how
# progress on the Windows port gets recorded.
#
# Triggers: this is a Rust build of a large workspace and it is slow, so it does not run on
# pushes that have nothing to do with it. Only a change to the patches, the pin, or this file
# can start it — plus `workflow_dispatch` for when you want to know whether upstream still
# applies.
name: libkrun-windows

on:
  push:
    branches: [main]
    paths:
      - "packaging/libkrun-windows/**"
      - ".github/workflows/libkrun-windows.yml"
  pull_request:
    paths:
      - "packaging/libkrun-windows/**"
      - ".github/workflows/libkrun-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libkrun-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash. The patch-application step below is ordinary shell, and it is the same
        # shell a developer would run by hand when reproducing this locally.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: boks

      - name: Read the pinned upstream revision
        id: pin
        run: |
          set -euo pipefail
          # Comments and blank lines stripped; the SHA is the one remaining line.
          rev="$(grep -v '^[[:space:]]*#' boks/packaging/libkrun-windows/UPSTREAM_REV | tr -d '[:space:]')"
          case "$rev" in
            [0-9a-f]*) ;;
            *) echo "UPSTREAM_REV does not contain a commit SHA: '$rev'" >&2; exit 1 ;;
          esac
          if [ "${#rev}" -ne 40 ]; then
            echo "UPSTREAM_REV must be a full 40-character SHA, got ${#rev} characters" >&2
            exit 1
          fi
          echo "rev=$rev" >>"$GITHUB_OUTPUT"

      # `fetch-depth: 0` because a pinned SHA is not necessarily reachable from the default
      # branch tip that a shallow clone would fetch.
      - uses: actions/checkout@v5
        with:
          repository: containers/libkrun
          ref: ${{ steps.pin.outputs.rev }}
          path: libkrun
          fetch-depth: 0

      # `git apply`, not `git am`: `am` writes commits, and writing a commit needs a
      # committer identity that a runner does not have — it fails with "empty ident name"
      # before it ever looks at the patch. Nothing here needs the history, only the tree.
      #
      # No `--3way` and no fuzz. The revision is pinned, so the patches either apply exactly
      # or the pin and the series have drifted apart, and a fuzzy application would hide
      # precisely the breakage this job exists to find.
      - name: Apply the Boks Windows patches
        working-directory: libkrun
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(../boks/packaging/libkrun-windows/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches found — packaging/libkrun-windows/patches/ is empty" >&2
            exit 1
          fi
          echo "Applying ${#patches[@]} patch(es) onto ${{ steps.pin.outputs.rev }}"
          git apply --verbose "${patches[@]}"

      # windows-latest ships rustup and a host toolchain, so the target is already installed
      # and there is no third-party toolchain action to add. `rustup show` is here to put the
      # exact compiler version in the log: when this job starts failing without a patch
      # change, a toolchain bump is the first suspect.
      - name: Record the toolchain
        run: |
          rustup show
          cargo --version

      # ---------------------------------------------------------------------------------
      # The crates that build for Windows today. This job is REQUIRED. If a patch refresh or
      # a pin bump breaks one of these, that is a regression and it should stop the merge.
      #
      # Verified: this list was produced by checking each crate in the workspace against
      # `x86_64-pc-windows-msvc` with this exact patch series applied. Note the verification
      # was done by cross-compiling from Linux — see the header for why CI does it natively
      # instead — so the list is a floor rather than a guarantee on first run. If a crate
      # here fails natively for a reason unrelated to our patches, move it down to
      # `remaining` with a comment saying why rather than deleting the check.
      # ---------------------------------------------------------------------------------
      - name: Compile the crates that support Windows
        working-directory: libkrun
        run: |
          set -euo pipefail
          for crate in krun-utils krun-polly krun-arch-gen krun-smbios krun-whp krun-kernel krun-arch krun-devices; do
            echo "::group::cargo check -p $crate"
            cargo check --target x86_64-pc-windows-msvc -p "$crate"
            echo "::endgroup::"
          done
          # Boks needs virtio-blk as well as the default device set, so the feature that
          # carries it is checked rather than assumed to be harmless.
          echo "::group::cargo check -p krun-devices --features blk"
          cargo check --target x86_64-pc-windows-msvc -p krun-devices --features blk
          echo "::endgroup::"

      # ---------------------------------------------------------------------------------
      # EXPECTED TO FAIL. These are the crates the port has not reached yet, and this step is
      # a progress report, not a gate. Each entry names what is blocking it, as of the pinned
      # revision with this series applied:
      #
      #   krun-vmm      The real blocker, and it is not a compile error to chip away at:
      #                 libkrun has no Windows hypervisor backend at all. `src/vmm/src/lib.rs`
      #                 declares only `mod linux` and `mod macos`, and `device_manager/` holds
      #                 only `kvm/` and `hvf/`. `krun-whp` — the WHP bindings — compiles and is
      #                 in the required step above, but nothing calls it: the vstate and MMIO
      #                 glue that turns those bindings into a running VM is unwritten. For
      #                 scale, the equivalents are 778 + 569 lines on macOS and 2088 + 588 on
      #                 Linux. The ~58 errors this step reports are downstream of that absence,
      #                 so fixing them individually would be churn.
      #
      #   libkrun       The cdylib. Blocked on krun-vmm; it is the last thing to go green, and
      #                 when it does, `krun.dll` exists.
      #
      # krun-cpuid is deliberately absent from both lists. It is built against `kvm_bindings`,
      # and KVM is Linux-only, so the series gates it out of the Windows dependency graph
      # rather than porting it — WHP handles CPUID exits itself, via `complete_cpuid`. Checking
      # it for Windows would be asking whether a crate the Windows build never uses compiles.
      #
      # MOVE A CRATE UP to the required step above as soon as it compiles. That is the whole
      # ratchet: this step shrinks, that step grows, and neither is ever quietly relaxed.
      # ---------------------------------------------------------------------------------
      - name: Compile the crates that do not yet (expected to fail)
        id: remaining
        continue-on-error: true
        working-directory: libkrun
        run: |
          set -uo pipefail
          failed=()
          for crate in krun-vmm libkrun; do
            echo "::group::cargo check -p $crate"
            if cargo check --target x86_64-pc-windows-msvc -p "$crate"; then
              echo "$crate COMPILES"
            else
              failed+=("$crate")
            fi
            echo "::endgroup::"
          done
          printf 'still-failing=%s\n' "${failed[*]-}" >>"$GITHUB_OUTPUT"
          [ ${#failed[@]} -eq 0 ]

      - name: Record how far the port got
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## libkrun for \`x86_64-pc-windows-msvc\`"
            echo
            echo "Upstream \`${{ steps.pin.outputs.rev }}\` + \`packaging/libkrun-windows/patches/\`."
            echo
            if [ "${{ steps.remaining.outcome }}" = success ]; then
              echo "**Every crate compiled, \`libkrun\` included.** The port has reached the"
              echo "cdylib. Promote the remaining crates into the required step and delete"
              echo "the expected-to-fail step in \`.github/workflows/libkrun-windows.yml\`."
            else
              echo "Still failing: \`${{ steps.remaining.outputs.still-failing }}\`"
              echo
              echo "Expected — see the comment above that step for what blocks each crate."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
