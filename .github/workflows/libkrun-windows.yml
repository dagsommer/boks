# Compile-check our Windows patches for libkrun against a pinned upstream tree.
#
# Boks' VMM is libkrun, and libkrun does not build for Windows yet. `packaging/libkrun-windows/`
# holds the patches that move that wall; this workflow is what stops them from rotting. It
# checks out `containers/libkrun` at the pinned revision, applies the series, and compiles it
# for `x86_64-pc-windows-msvc`. Read packaging/libkrun-windows/README.md first — it explains
# what the patches are and why they exist here rather than upstream.
#
# Native `windows-latest`, not a cross-compile from Linux. That is not a preference, it is a
# correctness requirement: several crates in the dependency graph run `cc` from a build script
# (`bzip2-sys`, `zstd-sys`), and cross-checking from Linux fails them for want of `cl.exe` —
# an artifact of the checking host that says nothing about Windows. A native runner has the
# MSVC toolchain and reports the portability errors we actually care about.
#
# WHAT THIS JOB PROVES. It compiles every crate for Windows and links the cdylib, so a
# regression in the patch series or a drifted pin stops a merge. It proves the artifact
# builds and exports what nerdbox will look for — it does not prove a VM can start. A VM has
# since started, repeatedly, on real Windows 11 hardware: `boks run` completed unelevated on
# 2026-08-15 with the policy engine judging real traffic (docs/verification.md). None of that
# was established here, and nothing here would have caught the four defects those runs found.
#
# WHAT IT SHIPS. `krun.dll`, as an artifact and — through release.yml, which calls this
# workflow — as a release asset. It used to be built, size-checked, symbol-checked and then
# thrown away, which made this the one Windows piece a user could not obtain at all.
#
# Triggers: this is a Rust build of a large workspace and it is slow, so it does not run on
# pushes that have nothing to do with it. Only a change to the patches, the pin, or this file
# can start it — plus `workflow_dispatch` for when you want to know whether upstream still
# applies, and `workflow_call` so release.yml can build the DLL at the tag rather than
# fetching one built from some other commit. A `paths:` filter constrains only the event it
# is written under, so `workflow_call` is unaffected by the two above it.
name: libkrun-windows

on:
  push:
    branches: [main]
    paths:
      - "packaging/libkrun-windows/**"
      - ".github/workflows/libkrun-windows.yml"
  pull_request:
    paths:
      - "packaging/libkrun-windows/**"
      - ".github/workflows/libkrun-windows.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# `github.workflow` is the CALLER's workflow name when this runs as a reusable workflow, so a
# release build and a direct run of this workflow on the same ref land in different groups. It
# matters because `cancel-in-progress` is on: without it, a `workflow_dispatch` of release.yml
# on `main` and a push-triggered run of this file on `main` would cancel each other, and the
# one that dies would be the release. If that assumption about `github.workflow` is ever wrong
# the group collapses to what it was before, which is today's behaviour rather than a new bug.
concurrency:
  group: ${{ github.workflow }}-libkrun-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash. The patch-application step below is ordinary shell, and it is the same
        # shell a developer would run by hand when reproducing this locally.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: boks

      - name: Read the pinned upstream revision
        id: pin
        run: |
          set -euo pipefail
          # Comments and blank lines stripped; the SHA is the one remaining line.
          rev="$(grep -v '^[[:space:]]*#' boks/packaging/libkrun-windows/UPSTREAM_REV | tr -d '[:space:]')"
          case "$rev" in
            [0-9a-f]*) ;;
            *) echo "UPSTREAM_REV does not contain a commit SHA: '$rev'" >&2; exit 1 ;;
          esac
          if [ "${#rev}" -ne 40 ]; then
            echo "UPSTREAM_REV must be a full 40-character SHA, got ${#rev} characters" >&2
            exit 1
          fi
          echo "rev=$rev" >>"$GITHUB_OUTPUT"

      # `fetch-depth: 0` because a pinned SHA is not necessarily reachable from the default
      # branch tip that a shallow clone would fetch.
      - uses: actions/checkout@v5
        with:
          repository: containers/libkrun
          ref: ${{ steps.pin.outputs.rev }}
          path: libkrun
          fetch-depth: 0

      # `git apply`, not `git am`: `am` writes commits, and writing a commit needs a
      # committer identity that a runner does not have — it fails with "empty ident name"
      # before it ever looks at the patch. Nothing here needs the history, only the tree.
      #
      # No `--3way` and no fuzz. The revision is pinned, so the patches either apply exactly
      # or the pin and the series have drifted apart, and a fuzzy application would hide
      # precisely the breakage this job exists to find.
      - name: Apply the Boks Windows patches
        working-directory: libkrun
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(../boks/packaging/libkrun-windows/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches found — packaging/libkrun-windows/patches/ is empty" >&2
            exit 1
          fi
          echo "Applying ${#patches[@]} patch(es) onto ${{ steps.pin.outputs.rev }}"
          git apply --verbose "${patches[@]}"

      # windows-latest ships rustup and a host toolchain, so the target is already installed
      # and there is no third-party toolchain action to add. `rustup show` is here to put the
      # exact compiler version in the log: when this job starts failing without a patch
      # change, a toolchain bump is the first suspect.
      - name: Record the toolchain
        run: |
          rustup show
          cargo --version

      # ---------------------------------------------------------------------------------
      # The crates that build for Windows today. This job is REQUIRED. If a patch refresh or
      # a pin bump breaks one of these, that is a regression and it should stop the merge.
      #
      # Verified: this list was produced by checking each crate in the workspace against
      # `x86_64-pc-windows-msvc` with this exact patch series applied. Note the verification
      # was done by cross-compiling from Linux — see the header for why CI does it natively
      # instead — so the list is a floor rather than a guarantee on first run. If a crate
      # here fails natively for a reason unrelated to our patches, move it down to
      # `remaining` with a comment saying why rather than deleting the check.
      # ---------------------------------------------------------------------------------
      - name: Compile the crates that support Windows
        working-directory: libkrun
        run: |
          set -euo pipefail
          for crate in krun-utils krun-polly krun-arch-gen krun-smbios krun-whp krun-kernel krun-arch krun-devices krun-vmm libkrun; do
            echo "::group::cargo check -p $crate"
            cargo check --target x86_64-pc-windows-msvc -p "$crate"
            echo "::endgroup::"
          done
          # The features Boks actually needs, checked rather than assumed harmless: blk for
          # the VM rootfs disk nerdbox attaches, and net for the virtio-net device that
          # carries guest traffic to the policy engine. TSI is gated off on Windows, so a
          # build without `net` gives a VM with no network at all rather than a slower one.
          for feats in blk net blk,net; do
            echo "::group::cargo check -p libkrun --features $feats"
            cargo check --target x86_64-pc-windows-msvc -p libkrun --features "$feats"
            echo "::endgroup::"
          done

      # ---------------------------------------------------------------------------------
      # Every crate now compiles, so the old expected-to-fail step is gone and this one takes
      # its place: it LINKS the cdylib. That is a materially stronger claim than `cargo check`,
      # and it is not a formality — a real link is what caught `build.rs` stamping an ELF
      # `-soname` onto a PE file, because the crate used `#[cfg(target_os)]`, which describes
      # the host rather than the target. `cargo check` never runs the linker and never saw it.
      #
      # The export assertions matter for a reason particular to how this DLL is consumed:
      # containerd's nerdbox shim reflects over its whole binding table and resolves every
      # symbol EAGERLY at load. One missing export does not fail late at the call site — it
      # fails the load, on every platform.
      #
      # krun-cpuid is deliberately absent from this workflow entirely. It is built against
      # `kvm_bindings`, and KVM is Linux-only, so the series gates it out of the Windows
      # dependency graph rather than porting it — WHP handles CPUID exits itself, via
      # `complete_cpuid`. Asking whether a crate the Windows build never uses compiles is a
      # question with no consequence either way.
      #
      # READ THE GREEN HONESTLY. Everything here is compile- and link-time evidence, and the
      # history of this series says exactly how little that is worth on its own: every defect
      # that has actually stopped a Windows boot — the misaligned WHP register struct, the
      # frozen APIC timer, the IOAPIC pins the MPTable never described, a CMOS device with no
      # clock in it — was found by running a guest, and every one of them was present in a
      # binary this job had already passed. A green run means the artifact exists and exports
      # what its consumer will look for. Nothing more.
      # ---------------------------------------------------------------------------------
      - name: Link krun.dll and check the exports a boot depends on
        working-directory: libkrun
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-pc-windows-msvc -p libkrun --features blk,net
          dll=target/x86_64-pc-windows-msvc/release/krun.dll
          test -f "$dll" || { echo "no krun.dll was produced" >&2; exit 1; }
          echo "krun.dll: $(wc -c <"$dll") bytes"
          # ALL TWENTY symbols nerdbox binds, not a sample. Its loader reflects over the
          # whole binding table and resolves every one eagerly, so the DLL either satisfies
          # all of them or fails to load — there is no partial success to sample for. This
          # list is every `C:"krun_..."` tag on the libkrun struct in nerdbox's
          # internal/vm/libkrun/krun.go, AS PATCHED by packaging/nerdbox-windows/patches/.
          # Regenerate it, rather than editing by hand, with:
          #
          #   grep -oE 'C:"krun_[a-z0-9_]+"' internal/vm/libkrun/krun.go \
          #     | sed 's/C:"//;s/"//' | sort | tr '\n' ' '
          #
          # It was nineteen until nerdbox patch 0003 added krun_add_vsock. That patch exists
          # because libkrun de84d01 removed the implicit vsock device, so the ports nerdbox
          # maps now answer -ENODEV unless krun_add_vsock() was called first — which means a
          # binding, which means one more export this DLL has to carry.
          #
          # Measured on a real Windows 11 machine on 2026-08-13: 18 of 19 resolved, and the
          # missing one — krun_set_console_output, gated behind an unrelated `aws-nitro`
          # feature — was enough on its own to stop nerdbox loading the DLL. A four-symbol
          # sample had reported everything fine.
          #
          # Match WHOLE names, not substrings. A bare `grep -qa krun_add_vsock` is satisfied by
          # the bytes of `krun_add_vsock_port2`, and `krun_add_disk` by `krun_add_disk2`, so a
          # substring test would report those two present no matter what the DLL exports.
          # Export names sit in the name table as NUL-terminated ASCII, so replacing every
          # non-printable byte with a newline puts each name alone on a line and `grep -qx`
          # can then be exact. `tr` rather than `strings` — coreutils is there on the runner,
          # binutils is not guaranteed to be.
          tr -c '[:print:]' '\n' <"$dll" | sort -u >/tmp/krun-dll-strings.txt
          missing=0
          for sym in krun_add_disk krun_add_disk2 krun_add_net_unixgram krun_add_net_unixstream krun_add_virtiofs3 krun_add_vsock krun_add_vsock_port2 krun_create_ctx krun_free_ctx krun_get_shutdown_eventfd krun_init_log krun_set_console_output krun_set_exec krun_set_gpu_options krun_set_gvproxy_path krun_set_kernel krun_set_log_level krun_set_net_mac krun_set_vm_config krun_start_enter; do
            if grep -qxF "$sym" /tmp/krun-dll-strings.txt; then
              echo "  export present: $sym"
            else
              echo "  EXPORT MISSING: $sym — nerdbox resolves eagerly, so this fails the load" >&2
              missing=$((missing + 1))
            fi
          done
          # Report every missing export, not just the first: nerdbox names only the one symbol
          # its loader tripped over, so a one-at-a-time CI is a one-boot-at-a-time diagnosis.
          if [ "$missing" -ne 0 ]; then
            echo "$missing of 20 bound symbols are not exported" >&2
            exit 1
          fi
          echo "all 20 symbols nerdbox binds are exported"

      # The DLL was built, measured and asserted against, and then discarded — so the one
      # piece of the Windows runtime a user cannot build without an MSVC toolchain and a Rust
      # workspace was the one piece CI refused to hand over. It is staged under a bare
      # `krun.dll`, which is the name nerdbox's loader passes to LoadLibrary.
      #
      # SHA256SUMS travels with it because release.yml checks it on the far side of the
      # artifact transport before laying the file into a release archive. A file that arrives
      # truncated is otherwise perfectly plausible right up until a machine tries to load it.
      - name: Stage krun.dll with its checksum
        working-directory: libkrun
        run: |
          set -euo pipefail
          mkdir -p _out
          cp target/x86_64-pc-windows-msvc/release/krun.dll _out/krun.dll
          (cd _out && sha256sum krun.dll >SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: krun-dll-windows-amd64
          path: libkrun/_out/*
          if-no-files-found: error
          retention-days: 30

      - name: Record how far the port got
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## libkrun for \`x86_64-pc-windows-msvc\`"
            echo
            echo "Upstream \`${{ steps.pin.outputs.rev }}\` + \`packaging/libkrun-windows/patches/\`."
            echo
            echo "Every crate compiles and \`krun.dll\` links with \`blk,net\`."
            echo
            echo '```'
            (cd libkrun/_out && cat SHA256SUMS) 2>/dev/null || echo "(build failed)"
            echo '```'
            echo
            echo "This job's evidence is compile- and link-time only: the artifact exists and"
            echo "exports all 20 symbols nerdbox resolves eagerly at load. It starts no VM —"
            echo "GitHub's Windows runners are themselves virtualised and there is no WHP"
            echo "partition to be had. A DLL built here HAS since run on real hardware:"
            echo "\`boks run\` completed unelevated on Windows 11 on 2026-08-15, with the"
            echo "policy engine judging real traffic. See docs/verification.md — and note that"
            echo "every defect those runs found was already present in a binary this job passed."
          } >>"$GITHUB_STEP_SUMMARY"
