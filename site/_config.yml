# Configuration for the documentation site published at https://dagsommer.github.io/boks/.
#
# The site does not contain any documentation of its own. Every page is generated at build
# time from Markdown that already lives in the repository — README.md and docs/*.md — by
# _plugins/boks_docs.rb. Nothing here is a copy, so nothing here can drift from the file a
# contributor edits.
#
# To add a document to the site: write it in docs/, then add an entry to `boks_docs` below.

title: Boks
description: >-
  Run coding agents and other untrusted developer tooling inside isolated microVMs, on your
  own machine.

# Project pages live under /boks/. Build with `--baseurl ''` to preview from a local server
# rooted at /.
url: https://dagsommer.github.io
baseurl: /boks

# Where a link that leaves the site points. Used for links to files the site does not
# publish (LICENSE, images/, the source of each page) and for the "edit this page" link.
repo: https://github.com/dagsommer/boks
repo_branch: main

markdown: kramdown
kramdown:
  input: GFM
  # The documents are hard-wrapped at ~90 columns. GFM's default of turning every newline
  # into a <br> would put a line break in the middle of most sentences.
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

# The landing page at / is site/index.html, not a rendered document. What it says about the
# project is quoted from the file named here — the lede, and the experimental warning — so
# there is still no second copy of either, and the warning cannot be softened on the front
# page without being softened in the README. If the warning is not found, the build fails.
home_source: README.md

# The nav, in order. `source` is a path relative to the repository root; `title` is read
# from the document's own first heading unless given here; `nav` is the (usually shorter)
# label in the sidebar. A source file that does not exist fails the build rather than
# quietly disappearing from the site.
#
# An entry with only `section` is a heading in the sidebar and produces no page.
#
# The order is task-oriented, after the reference product's own documentation: what you do
# first, then what you do next, then what you look up.
#
# The site publishes the pages a *user* of Boks needs. The engineering record — the
# verification log, the Docker Sandbox parity matrix, the Windows feasibility spike, the
# libkrun virtio-net analysis — stays in docs/ for contributors and is deliberately not
# listed here. Published pages that cite those documents still link to them: the build
# rewrites a link to an unpublished doc into a link to the file on GitHub, so every claim
# remains one click from its evidence. The security model is published on purpose — the
# product's whole claim is isolation, and a user deciding whether to trust it deserves that
# page.
boks_docs:
  - section: Guide
  - source: docs/get-started.md
    url: /get-started/
    nav: Get started
  - source: docs/install.md
    url: /install/
    nav: Install
  - source: docs/walkthrough.md
    url: /walkthrough/
    nav: Walkthrough
  - source: docs/usage.md
    url: /usage/
    nav: Usage
  - source: docs/agents.md
    url: /agents/
    nav: Agents

  - section: Reference
  - source: docs/architecture.md
    url: /architecture/
    nav: Architecture
  - source: docs/security-model.md
    url: /security-model/
    nav: Security model
  - source: docs/cli.md
    url: /cli/
    nav: CLI reference
  - source: docs/troubleshooting.md
    url: /troubleshooting/
    nav: Troubleshooting
  - source: docs/faq.md
    url: /faq/
    nav: FAQ

  - section: Project
  - source: docs/roadmap.md
    url: /roadmap/
    nav: Roadmap
  - source: docs/release-notes.md
    url: /release-notes/
    nav: Release notes

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
